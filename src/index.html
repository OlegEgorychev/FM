<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Youth Academy Manager v{{VERSION}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Mono&display=swap" rel="stylesheet">
<style>
{{CSS}}</style>
</head>
<body>
<div id="screen">
  <!-- Scene backdrops (cross-faded per tab) -->
  <div class="scene active" id="scene-office" aria-hidden="true"></div>
  <div class="scene" id="scene-squad" aria-hidden="true"></div>
  <div class="scene" id="scene-match" aria-hidden="true"></div>
  <div class="scene" id="scene-notes" aria-hidden="true"></div>
  <div class="scene" id="scene-tactics" aria-hidden="true"></div>
  <div class="scene" id="scene-table" aria-hidden="true"></div>
  <div class="rain" aria-hidden="true"></div>

  <div id="desktop">
    <nav class="icons" aria-label="Desktop">
      <button class="icon" data-view="dash"><span class="glyph">&#8962;</span><span data-i18n="nav.dash">Dashboard</span></button>
      <button class="icon" data-view="team"><span class="glyph">&#9783;</span><span data-i18n="nav.team">Team</span></button>
      <button class="icon" data-view="table"><span class="glyph">&#9776;</span><span data-i18n="nav.table">League</span></button>
      <button class="icon dyn" data-view="match" id="icon-match" hidden><span class="glyph">&#9673;</span><span data-i18n="nav.match">Match</span></button>
      <button class="icon readme-ico" data-view="readme"><span class="glyph">&#9636;</span><span data-i18n="nav.readme">ReadMe.txt</span></button>
      <button class="icon dyn" data-view="notes" id="icon-notes" hidden><span class="glyph">&#9998;</span><span data-i18n="nav.notebook">Notebook</span></button>
    </nav>

    <!-- DASHBOARD (home screen) -->
    <section class="win" id="win-dash">
      <div class="titlebar"><span class="t-ico">&#8962;</span><span class="t-txt" data-i18n="dash.title"></span>
        <button class="tb-btn" data-i18n-aria="ui.min">_</button><button class="tb-btn" data-i18n-aria="ui.close">&times;</button></div>
      <div class="win-body">
        <div class="dash3">
          <!-- LEFT: next event, main button, legend, club -->
          <aside class="dash-left">
            <div class="groupbox next-card"><span class="gb-label" data-i18n="dash.next"></span>
              <div id="next-event"></div>
            </div>
            <button class="btn go big" id="btn-sim"></button>
            <p class="sim-hint" id="sim-hint"></p>
            <div class="groupbox"><span class="gb-label" data-i18n="cal.legend"></span>
              <ul class="cal-legend" id="cal-legend"></ul>
            </div>
            <div class="groupbox"><span class="gb-label" data-i18n="dash.club"></span>
              <dl class="kv" id="club-kv"></dl>
            </div>
          </aside>
          <!-- CENTER: month grid + diary -->
          <div class="dash-center">
            <div class="cal-head">
              <button class="btn small" id="cal-prev" data-i18n-aria="cal.prevMonth">&#9664;</button>
              <div class="cal-title"><b id="cal-month"></b><span id="cal-today"></span></div>
              <button class="btn small" id="cal-next" data-i18n-aria="cal.nextMonth">&#9654;</button>
            </div>
            <div class="cal-grid sunken" id="cal-grid" role="grid"></div>
            <div class="groupbox"><span class="gb-label" data-i18n="dash.ticker"></span>
              <div class="ticker sunken" id="ticker" role="log" aria-live="polite"></div>
            </div>
          </div>
          <!-- RIGHT: latest results + mini table -->
          <aside class="dash-right">
            <div class="groupbox"><span class="gb-label" id="md-fx-label"></span>
              <div class="fx-list mini" id="md-fixtures"></div>
            </div>
            <div class="groupbox"><span class="gb-label" data-i18n="dash.top5"></span>
              <table class="grid mini-table"><tbody id="mini-table"></tbody></table>
              <button class="btn small full" id="btn-full-table" data-i18n="dash.fullTable"></button>
            </div>
          </aside>
        </div>
      </div>
      <div class="statusbar"><span id="dash-status"></span><span id="dash-season"></span></div>
    </section>

    <!-- TEAM MANAGEMENT (roster + tactics board) -->
    <section class="win" id="win-team">
      <div class="titlebar"><span class="t-ico">&#9783;</span><span class="t-txt" data-i18n="team.title"></span>
        <button class="tb-btn" data-close data-i18n-aria="ui.min">_</button><button class="tb-btn" data-close data-i18n-aria="ui.close">&times;</button></div>
      <div class="win-body team-body">
        <div class="team-grid">
          <!-- LEFT: roster -->
          <div class="panel">
            <div class="panel-head"><b id="roster-title"></b><span class="legend" data-i18n="team.legendShort"></span></div>
            <div class="roster-cols" aria-hidden="true">
              <span>#</span><span data-i18n="team.colName"></span><span data-i18n="team.colEnergy"></span><span data-i18n="team.colRole"></span>
            </div>
            <div class="roster sunken" id="roster" role="listbox" aria-label="Roster"></div>
          </div>
          <!-- RIGHT: tactics board -->
          <div class="panel">
            <div class="panel-head toolbar">
              <label class="inline-fld"><span data-i18n="tac.formation"></span>
                <select id="formation" class="sel98"></select></label>
              <button class="btn small" id="btn-auto" data-i18n="tac.auto"></button>
              <button class="btn small" id="btn-clear" data-i18n="team.clear"></button>
              <span class="swap-hint" id="swap-hint" role="status" hidden data-i18n="team.hintSel"></span>
            </div>
            <div class="tac-strip" id="tac-strength"></div>
            <div class="board-wrap"><div class="pitch board" id="tac-board"></div></div>
            <div class="tac-warn" id="tac-warn"></div>
          </div>
        </div>
      </div>
      <div class="statusbar"><span id="team-status"></span><span id="team-msg"></span></div>
    </section>

    <!-- MATCH -->
    <section class="win" id="win-match">
      <div class="titlebar"><span class="t-ico">&#9673;</span><span class="t-txt" id="match-title">MATCHDAY.EXE</span>
        <button class="tb-btn" data-close data-i18n-aria="ui.min">_</button><button class="tb-btn" data-close data-i18n-aria="ui.close">&times;</button></div>
      <div class="win-body match-body">

        <!-- LEFT: live roster & substitutions -->
        <aside class="mcol mcol-left">
          <div class="groupbox lr-box"><span class="gb-label" data-i18n="lr.title"></span>
            <div class="lr-head"><b id="lr-subs"></b></div>
            <div class="lr-list sunken" id="live-roster" role="listbox" aria-label="Live roster"></div>
            <p class="lr-help" id="lr-help"></p>
          </div>
        </aside>

        <!-- CENTER: scoreboard, timer, pitch, log, shouts, speed -->
        <div class="mcol mcol-center">
          <div class="match-top">
            <div class="scoreboard sunken">
              <div class="sb-team home" id="sb-home">HOME</div>
              <div class="sb-score" id="sb-score">0 - 0</div>
              <div class="sb-team" id="sb-away">AWAY</div>
              <div class="sb-clock"><span class="min" id="sb-min">00'</span>
                <div class="bar"><i id="sb-bar"></i><span class="ht"></span></div><span id="sb-period">PRE</span></div>
            </div>
            <div class="ctrl">
              <button class="btn go" id="btn-start"></button>
              <div class="speed" id="speed"></div>
            </div>
          </div>
          <div class="cam-holder"><div class="cam-view" id="radar-view">
            <div class="pitch radar" id="radar"></div>
            <span class="cam-live" aria-hidden="true">&#9679; LIVE</span>
            <div class="ht-banner" id="ht-banner" hidden>
              <div class="ht-box">
                <div class="ht-title" data-i18n="ht.title"></div>
                <div class="ht-score" id="ht-score"></div>
                <p class="ht-tip" data-i18n="ht.tip"></p>
                <button class="btn go" id="btn-resume" data-i18n="ht.resume"></button>
              </div>
            </div>
          </div></div>
          <div class="possession">
            <span><span data-i18n="match.ball"></span>: <b id="carrier">&mdash;</b></span>
            <span><span data-i18n="match.forms"></span>: <b id="forms">&mdash;</b></span>
            <span><span data-i18n="match.poss"></span>: <b id="poss">&mdash;</b></span>
          </div>
          <div class="log-wrap"><div class="log sunken" id="log" role="log" aria-live="polite"></div>
            <button class="btn small log-jump" id="log-jump" hidden data-i18n="match.newEvents"></button></div>
          <div class="mc-controls">
            <div class="shouts" role="group">
              <button class="btn shout" data-shout="attack" data-i18n="shout.attack" data-i18n-aria="shout.attackTip"></button>
              <button class="btn shout" data-shout="defend" data-i18n="shout.defend" data-i18n-aria="shout.defendTip"></button>
              <button class="btn shout" data-shout="balanced" data-i18n="shout.balanced" data-i18n-aria="shout.balancedTip"></button>
            </div>
            <div class="speeds" role="group" data-i18n-aria="match.speedLbl">
              <button class="btn small spd" data-speed="1" data-i18n="speed.1"></button>
              <button class="btn small spd" data-speed="2" data-i18n="speed.2"></button>
              <button class="btn small spd" data-speed="5" data-i18n="speed.5"></button>
            </div>
          </div>
        </div>

        <!-- RIGHT: assistant coach & live stats -->
        <aside class="mcol mcol-right">
          <div class="groupbox asst-box"><span class="gb-label" data-i18n="asst.title"></span>
            <div class="asst-wrap">
              <div class="asst-ava" aria-hidden="true">(&bull;_&bull;)<small>ASST.</small></div>
              <div class="asst-msgs" id="asst" aria-live="polite"></div>
            </div>
          </div>
          <div class="groupbox"><span class="gb-label" data-i18n="match.ourStats"></span>
            <dl class="statgrid" id="team-stats"></dl>
          </div>
        </aside>
      </div>
      <div class="statusbar"><span id="match-status"></span><span id="match-fixture"></span></div>
    </section>

    <!-- STANDINGS -->
    <section class="win" id="win-table">
      <div class="titlebar"><span class="t-ico">&#9776;</span><span class="t-txt" data-i18n="table.title"></span>
        <button class="tb-btn" data-close data-i18n-aria="ui.min">_</button><button class="tb-btn" data-close data-i18n-aria="ui.close">&times;</button></div>
      <div class="win-body">
        <div class="table-grid">
          <div class="tbl-left">
            <div class="tbl-wrap sunken">
              <table class="grid league clickable">
                <thead><tr>
                  <th class="c" data-i18n="table.pos"></th><th data-i18n="table.team"></th>
                  <th class="c" data-i18n="table.p"></th><th class="c" data-i18n="table.w"></th><th class="c" data-i18n="table.d"></th><th class="c" data-i18n="table.l"></th>
                  <th class="c" data-i18n="table.gf"></th><th class="c" data-i18n="table.ga"></th><th class="c" data-i18n="table.gd"></th><th class="c" data-i18n="table.pts"></th>
                  <th data-i18n="table.form"></th>
                </tr></thead>
                <tbody id="table-body"></tbody>
              </table>
            </div>
            <div class="groupbox"><span class="gb-label" data-i18n="table.results"></span>
              <div class="md-nav">
                <button class="btn small" id="md-prev" aria-label="Previous">&#9664;</button>
                <b id="md-label"></b>
                <button class="btn small" id="md-next" aria-label="Next">&#9654;</button>
              </div>
              <div class="fx-list" id="md-results"></div>
            </div>
          </div>
          <!-- v1.7: League leaders -->
          <div class="tbl-right">
            <div class="groupbox leaders"><span class="gb-label" data-i18n="table.scorers"></span>
              <div class="tbl-wrap sunken"><table class="grid lead-tbl" id="top-scorers"></table></div>
            </div>
            <div class="groupbox leaders"><span class="gb-label" data-i18n="table.assists"></span>
              <div class="tbl-wrap sunken"><table class="grid lead-tbl" id="top-assists"></table></div>
            </div>
          </div>
        </div>
      </div>
      <div class="statusbar"><span id="table-status"></span><span data-i18n="table.clickHint"></span></div>
    </section>

    <!-- README.TXT (patch notes, Notepad style) -->
    <section class="win" id="win-readme">
      <div class="titlebar"><span class="t-ico">&#9636;</span><span class="t-txt" data-i18n="readme.title"></span>
        <button class="tb-btn" data-close data-i18n-aria="ui.min">_</button><button class="tb-btn" data-close data-i18n-aria="ui.close">&times;</button></div>
      <div class="np-menu" aria-hidden="true"><span data-i18n="np.file"></span><span data-i18n="np.edit"></span><span data-i18n="np.format"></span><span data-i18n="np.help"></span></div>
      <div class="win-body np-body" id="readme-body"></div>
      <div class="statusbar"><span id="readme-status"></span><span>Ln 1, Col 1</span></div>
    </section>

    <!-- NOTEBOOK -->
    <section class="win" id="win-notes">
      <div class="titlebar"><span class="t-ico">&#9998;</span><span class="t-txt" data-i18n="notes.title"></span>
        <button class="tb-btn" data-close data-i18n-aria="ui.min">_</button><button class="tb-btn" data-close data-i18n-aria="ui.close">&times;</button></div>
      <div class="win-body" id="notes-body"></div>
      <div class="statusbar"><span id="notes-status"></span><span data-i18n="notes.saveHint"></span></div>
    </section>

  </div>

  <!-- IN-GAME MODAL (replaces any native alert) -->
  <div class="modal-layer" id="modal-layer" hidden>
    <section class="win modal open" role="alertdialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="titlebar"><span class="t-txt" id="modal-title"></span><button class="tb-btn" id="modal-x" data-i18n-aria="ui.close">&times;</button></div>
      <div class="win-body">
        <div class="dlg-body"><div class="dlg-ico info" id="modal-ico">i</div><div id="modal-text"></div></div>
        <div class="row-btns" id="modal-btns"></div>
      </div>
    </section>
  </div>

  <!-- v1.5: Player Profile Card (right-click a player / [i] button) -->
  <div class="pinfo-layer" id="pinfo-layer" hidden>
    <section class="win pinfo open" role="dialog" aria-modal="true" aria-labelledby="pinfo-title">
      <div class="titlebar"><span class="t-ico">i</span><span class="t-txt" id="pinfo-title">PLAYER_INFO.EXE</span><button class="tb-btn" id="pinfo-x" data-i18n-aria="ui.close">&times;</button></div>
      <div class="pinfo-tabs"><span class="pinfo-tab" data-i18n="pi.tab"></span></div>
      <div class="win-body pinfo-body" id="pinfo-body"></div>
      <div class="row-btns pinfo-btns"><button class="btn go" id="pinfo-ok" type="button" data-i18n="ui.ok"></button></div>
      <div class="statusbar"><span id="pinfo-status"></span></div>
    </section>
  </div>

  <!-- v1.7: Team Roster card (click a club in the League standings) -->
  <div class="pinfo-layer" id="troster-layer" hidden>
    <section class="win pinfo troster open" role="dialog" aria-modal="true" aria-labelledby="troster-title">
      <div class="titlebar"><span class="t-ico">&#9776;</span><span class="t-txt" id="troster-title">TEAM_ROSTER.EXE</span><button class="tb-btn" id="troster-x" data-i18n-aria="ui.close">&times;</button></div>
      <div class="pinfo-tabs"><span class="pinfo-tab" data-i18n="tr.tab"></span></div>
      <div class="win-body pinfo-body tr-body" id="troster-body"></div>
      <div class="row-btns pinfo-btns"><button class="btn go" id="troster-ok" type="button" data-i18n="ui.ok"></button></div>
      <div class="statusbar"><span id="troster-status"></span></div>
    </section>
  </div>

  <!-- v1.9: Locker room dialogue (narrative events) — covers everything, even the taskbar: a choice is required -->
  <div class="talk-layer" id="talk-layer" hidden>
    <section class="talk" role="dialog" aria-modal="true" aria-labelledby="talk-name" aria-describedby="talk-text">
      <div class="talk-strip"><span data-i18n="talk.strip"></span><span class="talk-budget" id="talk-budget"></span></div>
      <div class="talk-top">
        <span class="portrait talk-face" id="talk-face"></span>
        <div class="talk-who"><b id="talk-name"></b><small id="talk-role"></small></div>
      </div>
      <p class="talk-text" id="talk-text"></p>
      <div class="talk-choices" id="talk-choices"></div>
    </section>
  </div>

  <!-- v1.8: DEBUG.EXE (developer mode) -->
  <div class="pinfo-layer dbg-layer" id="debug-layer" hidden>
    <section class="win pinfo dbg open" role="dialog" aria-modal="true" aria-labelledby="debug-title">
      <div class="titlebar"><span class="t-ico">&#9881;</span><span class="t-txt" id="debug-title" data-i18n="dbg.title">DEBUG.EXE</span><button class="tb-btn" id="debug-x" data-i18n-aria="ui.close">&times;</button></div>
      <div class="pinfo-tabs dbg-tabs"><button type="button" class="pinfo-tab" data-dtab="db" data-i18n="dbg.tabDb"></button><button type="button" class="pinfo-tab" data-dtab="god" data-i18n="dbg.tabGod"></button></div>
      <div class="win-body dbg-body" id="debug-body"></div>
      <div class="row-btns pinfo-btns"><button class="btn go" id="debug-ok" type="button" data-i18n="ui.ok"></button></div>
      <div class="statusbar"><span id="debug-status"></span></div>
    </section>
  </div>

  <div id="startmenu" role="menu">
    <div class="side">ACADEMY 98</div>
    <ul>
      <li><button data-goto="dash">&#8962;&nbsp; <span data-i18n="nav.dash"></span></button></li>
      <li><button data-goto="team">&#9783;&nbsp; <span data-i18n="nav.team"></span></button></li>
      <li><button data-goto="table">&#9776;&nbsp; <span data-i18n="nav.table"></span></button></li>
      <li><button data-goto="readme">&#9636;&nbsp; <span data-i18n="nav.readmeLong"></span></button></li>
      <li id="sm-match" hidden><button data-goto="match">&#9673;&nbsp; <span data-i18n="nav.match"></span></button></li>
      <li id="sm-notes" hidden><button data-goto="notes">&#9998;&nbsp; <span data-i18n="nav.notebook"></span></button></li>
      <hr>
      <li><button id="btn-lang-menu">&#127760;&nbsp; <span data-i18n="ui.switchLang"></span></button></li>
      <li><button id="btn-fx">&#9635;&nbsp; <span id="fx-lbl"></span></button></li>
      <li><button id="btn-reset">&#9888;&nbsp; <span data-i18n="ui.newAcademy"></span></button></li>
    </ul>
  </div>

  <footer id="taskbar">
    <button class="tk start" id="btn-startmenu" aria-haspopup="menu"><span class="logo">&#9673;</span><span data-i18n="ui.start">Start</span></button>
    <span class="app-title" id="app-title" title="Youth Academy Manager"></span>
    <span class="budget" id="hdr-budget" role="status" aria-live="polite"></span>
    <span class="sep"></span>
    <div class="tasks">
      <button class="tk" data-view="dash">&#8962; <span class="lbl" data-i18n="nav.dash"></span></button>
      <button class="tk" data-view="team">&#9783; <span class="lbl" data-i18n="nav.team"></span></button>
      <button class="tk" data-view="table">&#9776; <span class="lbl" data-i18n="nav.table"></span></button>
      <span class="sep dyn-sep" id="dyn-sep" hidden></span>
      <button class="tk dyn" data-view="match" id="tk-match" hidden>&#9673; <span class="lbl" data-i18n="nav.match"></span></button>
      <button class="tk dyn" data-view="notes" id="tk-notes" hidden>&#9998; <span class="lbl" data-i18n="nav.notebook"></span></button>
    </div>
    <div class="tray">
      <button class="dbg-btn" id="btn-debug" type="button" data-i18n="dbg.btn">[DEBUG.EXE]</button>
      <button class="ver" id="btn-ver" data-i18n-aria="nav.readmeLong"></button>
      <button class="lang" id="btn-lang">RU</button>
      <span class="clk-label" id="tray-date"></span>
    </div>
  </footer>

  <!-- CRT overlay stack -->
  <div class="surge" id="surge" aria-hidden="true"></div>
  <div class="crt crt-scan"></div><div class="crt crt-grille"></div><div class="crt crt-roll"></div>
  <div class="crt crt-flicker"></div><div class="crt crt-glare"></div><div class="crt crt-vignette"></div>
</div>

<script>
{{JS}}</script>
</body>
</html>
