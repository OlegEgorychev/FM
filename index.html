class Lang {
  static KEY = 'yam_lang';
  constructor() {
    let saved = null;
    try { saved = localStorage.getItem(Lang.KEY); } catch (e) {}
    this.code = saved === 'en' || saved === 'ru' ? saved : 'ru';
  }
  set(code) { this.code = code; try { localStorage.setItem(Lang.KEY, code); } catch (e) {} }
  t(key, vars = {}) {
    const v = I18N[this.code][key] ?? I18N.en[key] ?? key;
    return typeof v === 'string' ? fmt(v, vars) : v;
  }
  name(full) { return this.code === 'ru' ? full.split(' ').map(w => RU_NAMES[w] || w).join(' ') : full; }
  team(n) { return this.code === 'ru' ? (RU_TEAMS[n] || n) : n; }
  pos(p) { return POS_LABEL[this.code][p] || p; }
  line(l) { return this.pos(LINE_POS[l]); }
  tag(key) { return TAGS[key] ? TAGS[key][this.code][0] : key; }
  tagDesc(key) { return TAGS[key] ? TAGS[key][this.code][1] : ''; }
  locale() { return this.code === 'ru' ? 'ru-RU' : 'en-GB'; }
}
const L = new Lang();

/* =========================================================
   PLAYER
   ========================================================= */
class Player {
  constructor({ id, name, position, attrs, tags, energy, number }) {
    this.id = id;
    this.name = name;
    this.position = position;
    this.number = number;
    this.attrs = attrs;              // HIDDEN — never rendered
    if (tags) {                      // only the academy squad carries tags + energy
      this.tags = tags;
      this.energy = energy ?? 100;
    }
  }
  get surname() { return this.name.split(' ').slice(-1)[0]; }

  static generate(id, position, usedSurnames, mod = 0, withTags = false, number = 0) {
    let last; let guard = 0;
    do { last = pick(LAST); } while (usedSurnames.has(last) && guard++ < 200);
    usedSurnames.add(last);
    const attrs = {};
    for (const a of ATTRS) { const [lo, hi] = PROFILES[position][a]; attrs[a] = clamp(rnd(lo, hi) + mod, 1, 20); }
    return new Player({ id, name: `${pick(FIRST)} ${last}`, position, attrs, number, tags: withTags ? [] : undefined });
  }
}

/* =========================================================
   DATES (ISO 'YYYY-MM-DD', always handled in UTC to avoid timezone drift)
   ========================================================= */
const isoAdd = (iso, days) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + days); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400000);
const fmtDate = (iso, opts) => new Date(iso + 'T00:00:00Z').toLocaleDateString(L.locale(), { timeZone: 'UTC', ...opts });
const SEASON = { START_MONTH_DAY: '09-01', FIRST_MATCH_OFFSET: 6, MATCH_INTERVAL: 7, FIRST_YEAR: 2002 };

/* =========================================================
   LEAGUE — 10 teams, double round-robin (18 matchdays x 5 fixtures)
   Team strength is HIDDEN: it drives AI rosters and AI-vs-AI results.
   ========================================================= */
class League {
  static STRENGTHS = [3, 2, 1, 1, 0, 0, -1, -2, -3];   // spread across the 9 AI clubs

  constructor({ teams, fixtures }) {
    this.teams = teams;
    this.fixtures = fixtures;
    for (const t of this.teams) if (t.roster) t.roster = t.roster.map(p => new Player(p));
  }

  static create(userName) {
    const strengths = shuffle(League.STRENGTHS);
    const teams = [{ id: 0, name: userName, user: true }];
    OPPONENTS.forEach((name, i) => teams.push({ id: i + 1, name, strength: strengths[i], formation: pick(FORMATION_KEYS), roster: null }));
    return new League({ teams, fixtures: League.roundRobin(teams.map(t => t.id)) });
  }

  /** Circle method: one team fixed, the rest rotate. Second half mirrors the first with home/away swapped. */
  static roundRobin(ids) {
    const n = ids.length, arr = shuffle(ids), rounds = [];
    for (let r = 0; r < n - 1; r++) {
      const md = [];
      for (let i = 0; i < n / 2; i++) {
        let h = arr[i], a = arr[n - 1 - i];
        if ((r + i) % 2 === 1) [h, a] = [a, h];
        md.push([h, a]);
      }
      rounds.push(md);
      arr.splice(1, 0, arr.pop());
    }
    const fixtures = [];
    rounds.forEach((md, r) => md.forEach(([h, a]) => fixtures.push({ md: r + 1, home: h, away: a, hg: null, ag: null })));
    rounds.forEach((md, r) => md.forEach(([h, a]) => fixtures.push({ md: r + n, home: a, away: h, hg: null, ag: null })));
    return fixtures;
  }

  get matchdays() { return (this.teams.length - 1) * 2; }
  team(id) { return this.teams.find(t => t.id === id); }
  fixturesOf(md) { return this.fixtures.filter(f => f.md === md); }
  userFixture(md) { return this.fixtures.find(f => f.md === md && (f.home === 0 || f.away === 0)); }
  played(f) { return f.hg !== null; }
  playedMatchdays() { return new Set(this.fixtures.filter(f => this.played(f)).map(f => f.md)).size; }

  /** AI roster is generated on first need and stored, so a club keeps the same kids all season. */
  roster(team, usedSurnames) {
    if (!team.roster) {
      team.roster = formationSlots(team.formation).map((s, i) =>
        Player.generate(`t${team.id}_${i}`, LINE_POS[s.line], usedSurnames, team.strength, false, i + 1));
    }
    return team.roster;
  }

  setUserResult(f, userGoals, oppGoals) {
    if (f.home === 0) { f.hg = userGoals; f.ag = oppGoals; } else { f.hg = oppGoals; f.ag = userGoals; }
  }

  /* Simplified background model: Poisson goals around a rating difference.
     rating = 50 + strength*4 (user club counts as 50). Home side gets a small edge. */
  rating(t) { return t.user ? 50 : 50 + t.strength * 4; }
  static poisson(lambda) { const l = Math.exp(-lambda); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > l); return Math.min(k - 1, 7); }
  simulateFixture(f) {
    const rh = this.rating(this.team(f.home)), ra = this.rating(this.team(f.away));
    // base rates tuned so AI games score like the visual engine does (~2 goals per game)
    f.hg = League.poisson(clamp(1.1 + (rh - ra) * 0.035, 0.15, 3));
    f.ag = League.poisson(clamp(0.85 + (ra - rh) * 0.035, 0.1, 2.8));
  }
  /** Resolve every unplayed AI-vs-AI fixture of a matchday. Returns those fixtures. */
  simulateOthers(md) {
    const done = [];
    for (const f of this.fixturesOf(md)) if (!this.played(f) && f.home !== 0 && f.away !== 0) { this.simulateFixture(f); done.push(f); }
    return done;
  }

  table() {
    const rows = new Map(this.teams.map(t => [t.id, { team: t, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0, form: [] }]));
    for (const f of [...this.fixtures].sort((a, b) => a.md - b.md)) {
      if (!this.played(f)) continue;
      const h = rows.get(f.home), a = rows.get(f.away);
      h.p++; a.p++; h.gf += f.hg; h.ga += f.ag; a.gf += f.ag; a.ga += f.hg;
      if (f.hg > f.ag) { h.w++; a.l++; h.pts += 3; h.form.push('W'); a.form.push('L'); }
      else if (f.hg < f.ag) { a.w++; h.l++; a.pts += 3; h.form.push('L'); a.form.push('W'); }
      else { h.d++; a.d++; h.pts++; a.pts++; h.form.push('D'); a.form.push('D'); }
    }
    const list = [...rows.values()];
    list.forEach(r => { r.gd = r.gf - r.ga; r.form = r.form.slice(-5); });
    return list.sort((x, y) => y.pts - x.pts || y.gd - x.gd || y.gf - x.gf || x.team.name.localeCompare(y.team.name));
  }
  position(teamId) { return this.table().findIndex(r => r.team.id === teamId) + 1; }

  toJSON() { return { teams: this.teams, fixtures: this.fixtures }; }
}

/* =========================================================
   CALENDAR ENGINE — event-driven day-by-day progression.
   New event types plug in with registerType(); daily routines with onDay().
     registerType('match',    { blocking: true,  label(ev), onArrive(ev) })
     registerType('training', { blocking: false, label(ev), onArrive(ev) })   // future
     registerType('dialogue', { blocking: true,  label(ev), onArrive(ev) })   // future
   Blocking events stop the simulation on their day and stay pending until
   completeEvent(); non-blocking ones fire and auto-complete as the day passes.
   ========================================================= */
class CalendarEngine {
  constructor(data) {
    this.attach(data);
    this.types = {};
    this.dailyHooks = [];
    this.timer = null;
    this.running = false;
  }
  attach(data) { this.data = data; }               // data = { date, events: [{id, type, date, done, ...}] }
  get date() { return this.data.date; }
  registerType(type, def) { this.types[type] = def; }
  onDay(fn) { this.dailyHooks.push(fn); }
  pending() { return this.data.events.filter(e => !e.done).sort((a, b) => a.date.localeCompare(b.date)); }
  nextEvent() { return this.pending()[0] || null; }
  eventsOn(date) { return this.pending().filter(e => e.date === date); }
  blockingToday() { return this.eventsOn(this.date).find(e => this.types[e.type]?.blocking) || null; }
  label(ev) { return this.types[ev.type]?.label?.(ev) ?? ev.type; }
  advanceDay() { this.data.date = isoAdd(this.data.date, 1); }
  completeEvent(id) { const e = this.data.events.find(x => x.id === id); if (e) e.done = true; }

  /** Runs one day. Returns { stopped: event|null, infos: [...] } */
  step() {
    const today = this.eventsOn(this.date);
    for (const e of today) if (!this.types[e.type]?.blocking) { this.types[e.type]?.onArrive?.(e); e.done = true; }
    const blocking = today.find(e => this.types[e.type]?.blocking);
    if (blocking) return { stopped: blocking, infos: [] };
    const date = this.date;
    const infos = this.dailyHooks.map(fn => fn(date)).filter(Boolean);
    this.advanceDay();
    return { stopped: null, date, infos };
  }

  /** Simulates days one by one (visibly) until a blocking event or the end of the calendar. */
  simulate({ stepMs = 180, onStep, onStop } = {}) {
    if (this.running) return;
    this.running = true;
    const tick = () => {
      const r = this.step();
      if (r.stopped) { this.stop(); this.types[r.stopped.type]?.onArrive?.(r.stopped); onStop?.(r.stopped); return; }
      onStep?.(r.date, r.infos);
      if (!this.nextEvent()) { this.stop(); onStop?.(null); }
    };
    tick();
    if (this.running) this.timer = setInterval(tick, stepMs);
  }
  stop() { this.running = false; clearInterval(this.timer); this.timer = null; }
}

/* =========================================================
   GAME STATE
   lineup[i] is the player in formation slot i (slot 0 = goalkeeper).
   phase: 'calendar' -> 'matchday' -> 'post' -> 'calendar' ... -> 'seasonEnd'
   ========================================================= */
class GameState {
  static KEY = 'yam_save_v1';

  constructor() {
    if (!this.load()) this.newAcademy();
  }

  newAcademy() {
    this.clubName = CLUB_NAME;
    this.formation = '4-4-2';
    const used = new Set();
    this.squad = SQUAD_POS.map((pos, i) => Player.generate(`a${i}`, pos, used, 0, true, i + 1));
    this.lineup = this.squad.slice(0, 11).map(p => p.id);
    this.autoArrange();
    this.newSeason(SEASON.FIRST_YEAR);
  }

  newSeason(year) {
    this.season = year;
    this.league = League.create(this.clubName);
    const start = `${year}-${SEASON.START_MONTH_DAY}`;
    const events = [];
    for (let md = 1; md <= this.league.matchdays; md++) {
      events.push({ id: `md${md}`, type: 'match', md, date: isoAdd(start, SEASON.FIRST_MATCH_OFFSET + SEASON.MATCH_INTERVAL * (md - 1)), done: false });
    }
    this.calendar = { date: start, events };
    this.phase = 'calendar';
    this.lastReport = null;
    this.notebookUnlocked = false;
    this.diary = [{ date: start, key: 'cal.welcome', vars: { y: year, z: String(year + 1).slice(2) } }];
    for (const p of this.squad) p.energy = 100;   // summer break
    this.save();
  }

  /* ----- current match context (from the calendar + league) ----- */
  nextMatchEvent() { return this.calendar.events.filter(e => !e.done && e.type === 'match').sort((a, b) => a.date.localeCompare(b.date))[0] || null; }
  matchContext() {
    const ev = this.nextMatchEvent();
    if (!ev) return null;
    const fixture = this.league.userFixture(ev.md);
    const opp = this.league.team(fixture.home === 0 ? fixture.away : fixture.home);
    const players = this.league.roster(opp, new Set(this.squad.map(p => p.surname)));
    return { ev, md: ev.md, fixture, opp, venue: fixture.home === 0 ? 'home' : 'away',
      team: { name: opp.name, players, formation: opp.formation } };
  }
  userRow() { return this.league.table().find(r => r.team.user); }

  /* ----- squad / lineup ----- */
  player(id) { return this.squad.find(p => p.id === id); }
  isStarter(id) { return this.lineup.includes(id); }
  starters() { return this.lineup.map(id => this.player(id)); }
  bench() { return this.squad.filter(p => !this.isStarter(p.id)); }
  slots() { return formationSlots(this.formation); }
  slotLine(id) { const i = this.lineup.indexOf(id); return i < 0 ? null : this.slots()[i].line; }
  outOfPosition() {
    const slots = this.slots();
    return this.starters().map((p, i) => ({ p, line: slots[i].line })).filter(({ p, line }) => NATURAL_LINE[p.position] !== line);
  }
  static gkError(players) { return players.filter(p => p.position === 'GK').length !== 1 ? 'gk' : null; }

  autoArrange() {
    const slots = this.slots();
    const pool = this.starters();
    const gk = pool.find(p => p.position === 'GK') || pool[0];
    const free = pool.filter(p => p !== gk).sort((a, b) => b.energy - a.energy);
    const assigned = new Array(slots.length).fill(null);
    slots.forEach((s, i) => {
      if (i === 0) return;
      const k = free.findIndex(p => NATURAL_LINE[p.position] === s.line);
      if (k >= 0) assigned[i] = free.splice(k, 1)[0];
    });
    slots.forEach((s, i) => {
      if (i === 0 || assigned[i]) return;
      const dist = p => Math.abs((LINE_IDX[NATURAL_LINE[p.position]] ?? 1) - LINE_IDX[s.line]);
      free.sort((a, b) => dist(a) - dist(b));
      assigned[i] = free.shift();
    });
    this.lineup = [gk.id, ...assigned.slice(1).map(p => p.id)];
  }
  setFormation(f) { if (!FORMATIONS[f]) return; this.formation = f; this.autoArrange(); this.save(); }
  /** Unified lineup swap used by both the roster list and the pitch.
      starter <-> starter : exchange formation slots
      starter <-> bench   : bench player takes the starter's slot
      Returns an error key (shown in a modal) or null. */
  swapPlayers(a, b) {
    const ia = this.lineup.indexOf(a), ib = this.lineup.indexOf(b);
    const pa = this.player(a), pb = this.player(b);
    if (!pa || !pb || (ia < 0 && ib < 0)) return 'bench';
    if (ia >= 0 && ib >= 0) {
      if (ia === 0 || ib === 0) return 'gkSlot';
      [this.lineup[ia], this.lineup[ib]] = [b, a];
    } else {
      const [slot, incoming] = ia >= 0 ? [ia, pb] : [ib, pa];
      if (slot === 0 && incoming.position !== 'GK') return 'gkOnly';
      if (slot !== 0 && incoming.position === 'GK') return 'gkTwo';
      this.lineup[slot] = incoming.id;
    }
    this.save();
    return null;
  }
  setTag(id, tag) { const p = this.player(id); if (p && TAGS[tag]) { p.tags = [tag]; this.save(); } }
  removeTag(id, tag) { const p = this.player(id); if (p) { p.tags = p.tags.filter(t => t !== tag); this.save(); } }

  /* ----- energy ----- */
  restDay() { for (const p of this.squad) p.energy = clamp(p.energy + ENERGY.DAILY_REST, 0, 100); }
  applyFatigue(playedIds) {
    for (const p of this.squad) {
      const delta = playedIds.includes(p.id) ? -rnd(ENERGY.PLAY_MIN, ENERGY.PLAY_MAX) : ENERGY.BENCH_REST;
      p.energy = clamp(Math.round(p.energy + delta), 0, 100);
    }
  }

  addDiary(entry) { this.diary.push(entry); if (this.diary.length > 80) this.diary.shift(); }

  save() {
    try {
      localStorage.setItem(GameState.KEY, JSON.stringify({
        v: 4, clubName: this.clubName, formation: this.formation, squad: this.squad, lineup: this.lineup,
        season: this.season, league: this.league, calendar: this.calendar, phase: this.phase,
        lastReport: this.lastReport, notebookUnlocked: this.notebookUnlocked, diary: this.diary,
      }));
    } catch (e) { /* storage unavailable: play in memory */ }
  }
  load() {
    try {
      const raw = localStorage.getItem(GameState.KEY);
      if (!raw) return false;
      const d = JSON.parse(raw);
      if (!Array.isArray(d.squad) || d.squad.length < 11) return false;
      this.clubName = d.clubName || CLUB_NAME;
      this.formation = FORMATIONS[d.formation] ? d.formation : '4-4-2';
      this.squad = d.squad.map(p => new Player({ ...p, tags: (Array.isArray(p.tags) ? p.tags : []).filter(t => TAGS[t]).slice(0, 1) }));
      if (this.squad.length === 11) {
        const used = new Set(this.squad.map(p => p.surname));
        SQUAD_POS.slice(11).forEach((pos, i) => this.squad.push(Player.generate(`a${11 + i}`, pos, used, 0, true)));
      }
      const taken = new Set(this.squad.map(p => p.number).filter(Boolean));
      let n = 1;
      for (const p of this.squad) if (!p.number) { while (taken.has(n)) n++; p.number = n; taken.add(n); }
      const ok = Array.isArray(d.lineup) && d.lineup.length === 11 && d.lineup.every(id => this.player(id))
        && !GameState.gkError(d.lineup.map(id => this.player(id)));
      this.lineup = ok ? d.lineup : this.squad.slice(0, 11).map(p => p.id);
      if (!d.v || d.v < 3 || this.player(this.lineup[0]).position !== 'GK') this.autoArrange();
      if (d.v >= 4 && d.league && d.calendar) {
        this.season = d.season;
        this.league = new League(d.league);
        this.calendar = d.calendar;
        this.phase = d.phase || 'calendar';
        this.lastReport = d.lastReport || null;
        this.notebookUnlocked = !!d.notebookUnlocked;
        this.diary = Array.isArray(d.diary) ? d.diary : [];
        // a match interrupted by a page reload is simply replayed
      } else {
        this.newSeason(SEASON.FIRST_YEAR);   // older saves: keep the squad, start the league
      }
      this.save();
      return true;
    } catch (e) { return false; }
  }
  reset() {
    try { localStorage.removeItem(GameState.KEY); } catch (e) {}
    this.newAcademy();
  }
}

/* =========================================================
   MATCH ENGINE
   Zones are relative to the team in possession:
   0 = own defensive third, 1 = midfield, 2 = attacking third.
   Who plays in a zone is decided by the FORMATION slot (DEF/MID/ATT line),
   not by the player's natural position.
   ========================================================= */
class MatchEngine {
  static SPEED = { 1: 900, 2: 450, 5: 180 };        // ms per in-game minute (proportional, so motion stays smooth)
  static HIGHLIGHT = { 1: 1200, 2: 900, 5: 650 };    // ms per beat of a shot sequence (aim -> strike -> outcome)

  constructor(home, away, hooks, opts = {}) {
    this.sides = [MatchEngine.buildSide(home, true), MatchEngine.buildSide(away, false)];
    this.hooks = hooks;
    this.minute = 0;
    this.stats = new Map();
    this.lineOf = new Map();
    for (const s of this.sides) for (const e of s.entries) { this.stats.set(e.p.id, MatchEngine.blankStats()); this.lineOf.set(e.p.id, e.line); }
    // Energy is checked once, at kick-off: under 50% => every hidden stat x0.5 for the whole match
    this.tired = new Set(home.players.filter(p => (p.energy ?? 100) < ENERGY.TIRED).map(p => p.id));
    this.mentality = opts.mentality || 'balanced';
    this.speed = opts.speed || 1;
    this.sentOff = new Set();
    this.timer = null;
    this.delay = 0;
    this.pendingShot = null;
    this.hold = 0;
    this.boxBonus = 0;
    this.started = false;
    this.finished = false;
    this.htLogged = false;
    this.possTicks = [0, 0];
    this.ev = { kind: 'kickoff' };
    this.evLog = [];   // recent {seq, ev} so the view never misses an event that was overwritten in the same tick
    this.seq = 0;
  }

  static buildSide(team, user) {
    const slots = formationSlots(team.formation);
    return { name: team.name, formation: team.formation, user, score: 0, players: team.players,
      entries: slots.map((s, i) => ({ ...s, p: team.players[i] })) };
  }
  static blankStats() { return { passOk: 0, passFail: 0, tackles: 0, tacklesLost: 0, shots: 0, onTarget: 0, goals: 0, dribbleOk: 0, dribbleFail: 0, saves: 0, yellow: 0, red: 0 }; }
  st(p) { return this.stats.get(p.id); }
  active(side) { return this.sides[side].players.filter(p => !this.sentOff.has(p.id)); }
  inZone(side, zone) {
    const line = ZONE_LINE[zone];
    const list = this.sides[side].entries.filter(e => e.line === line && !this.sentOff.has(e.p.id)).map(e => e.p);
    return list.length ? list : this.active(side).filter(p => this.lineOf.get(p.id) !== 'GK');
  }
  keeper(side) { return this.sides[side].entries[0].p; }
  isGK(p) { return this.lineOf.get(p.id) === 'GK'; }
  team(side) { return { team: this.sides[side].name }; }
  scoreVars() { return { h: this.team(0), x: this.sides[0].score, y: this.sides[1].score, a: this.team(1) }; }
  setEv(ev) { this.ev = ev; this.seq++; this.evLog.push({ seq: this.seq, ev }); if (this.evLog.length > 12) this.evLog.shift(); }

  /* ---------- the maths: tags, fatigue, position, shouts, numerical superiority ---------- */
  eff(p, attr) {
    let v = p.attrs[attr];
    if (this.tired.has(p.id)) v *= 0.5;
    if (NATURAL_LINE[p.position] !== this.lineOf.get(p.id)) v *= OUT_OF_POSITION;
    const t = p.tags || [];
    if (t.includes('Aggressive') && attr === 'Tackle') v *= 1.5;
    if (t.includes('Playmaker') && attr === 'Pass') v *= 1.5;
    if (t.includes('Selfish') && (attr === 'Dribble' || attr === 'Shoot')) v *= 1.5;
    return v;
  }
  mod(side, role) {
    if (side !== 0 || this.mentality === 'balanced') return 0;
    const pushing = this.mentality === 'attack';
    return (role === 'atk') === pushing ? 3 : -3;
  }
  counts(side) {
    const c = { DEF: 0, MID: 0, ATT: 0 };
    for (const e of this.sides[side].entries) if (e.line !== 'GK' && !this.sentOff.has(e.p.id)) c[e.line]++;
    return c;
  }
  /** Bonus for the team in possession `side` contesting zone z (red cards count too). */
  sup(side, z) {
    const diff = presence(this.counts(side), z) - presence(this.counts(1 - side), 2 - z);
    return clamp((diff - SUP_BASE[z]) * SUP_SCALE, -4, 4);
  }
  setMentality(m) {
    if (m === this.mentality) return;
    this.mentality = m;
    if (!this.finished && this.started) this.log('coach', 'eng.shout.' + m, {}, 0);
  }
  setSpeedMode(s) { this.speed = s; if (this.started && !this.finished) this.updateSpeed(); }

  /* ---------- clock & pacing ---------- */
  start() {
    this.started = true;
    this.kickoff(0);
    this.log('whistle', 'eng.kickoff', { a: this.team(0) }, 0);
    this.updateSpeed();
    this.hooks.onUpdate(this);
  }
  /* Highlight pacing: a shot sequence is ALWAYS played slowly, whatever the chosen speed. */
  desiredDelay() {
    if (this.pendingShot || this.hold > 0) return MatchEngine.HIGHLIGHT[this.speed] ?? 1200;
    return MatchEngine.SPEED[this.speed] ?? 600;
  }
  updateSpeed() {
    const d = this.desiredDelay();
    if (d === this.delay && this.timer) return;
    this.delay = d;
    clearInterval(this.timer);
    this.timer = setInterval(() => this.tick(), d);
    this.hooks.onSpeed?.(d);
  }
  get highlight() { return !!(this.pendingShot || this.hold > 0); }
  stop() { clearInterval(this.timer); this.timer = null; }

  tick() {
    if (this.finished) return;
    if (this.hold > 0) this.hold--;
    if (this.pendingShot) {
      const ps = this.pendingShot;
      if (ps.phase === 1) {
        ps.phase = 2;
        this.setEv({ kind: 'strike', a: ps.shooter, side: ps.side });
        this.log('shot', 'strike', { a: ps.shooter }, ps.side);
      } else this.resolveShot();
      this.afterAction();
      return;
    }
    this.minute++;
    if (this.minute === 46) {
      this.kickoff(1);
      this.log('whistle', 'eng.second', { a: this.team(1) }, 1);
    }
    this.possTicks[this.poss]++;
    this.act();
    this.afterAction();
  }

  afterAction() {
    if (!this.pendingShot) {
      if (this.minute >= 45 && !this.htLogged) { this.htLogged = true; this.log('whistle', 'eng.ht', this.scoreVars()); }
      if (this.minute >= 90) { this.finish(); return; }
    }
    this.updateSpeed();
    this.hooks.onUpdate(this);
  }

  finish() {
    this.stop();
    this.finished = true;
    this.log('whistle', 'eng.ft', this.scoreVars());
    this.hooks.onUpdate(this);
    this.hooks.onEnd(this);
  }

  /* ---------- possession helpers ---------- */
  kickoff(side) {
    this.poss = side;
    this.zone = 1;
    this.carrier = pick(this.inZone(side, 1));
    this.boxBonus = 0;
    this.setEv({ kind: 'kickoff' });
  }
  turnover(newCarrier, zone) {
    this.poss = 1 - this.poss;
    this.carrier = newCarrier;
    this.zone = zone;
    this.boxBonus = 0;
  }

  /* ---------- decision (tags bend the AI) ---------- */
  chooseAction() {
    const c = this.carrier;
    if (this.isGK(c)) return 'pass';
    const w = { ...[
      { pass: 80, dribble: 20, shoot: 0 },
      { pass: 60, dribble: 32, shoot: 8 },
      this.lineOf.get(c.id) === 'ATT' ? { pass: 28, dribble: 22, shoot: 50 } : { pass: 38, dribble: 27, shoot: 35 },
    ][this.zone] };
    const t = c.tags || [];
    if (t.includes('Playmaker')) { w.pass *= 2; w.dribble *= 0.4; }
    if (t.includes('Selfish')) {
      w.pass *= 0.08; w.dribble *= 1.6; w.shoot *= 1.8;
      if (this.zone === 1) w.shoot = Math.max(w.shoot, 22);
    }
    let r = Math.random() * (w.pass + w.dribble + w.shoot);
    for (const [action, weight] of Object.entries(w)) { if ((r -= weight) < 0) return action; }
    return 'pass';
  }

  act() {
    const action = this.chooseAction();
    if (action === 'pass') this.doPass();
    else if (action === 'dribble') this.doDribble();
    else this.startShot(this.carrier, false);
    if (!this.pendingShot && Math.random() < 0.04) this.log('flavor', 'flavor', {}, -1);
  }

  /* ---------- actions: (attacker stat + rand*10) vs (defender stat + rand*10) + modifiers ---------- */
  doPass() {
    const c = this.carrier, side = this.poss, opp = 1 - side, z = this.zone;
    let tz;
    if (this.isGK(c)) tz = Math.random() < 0.7 ? 0 : 1;
    else if (z === 0) tz = Math.random() < 0.65 ? 1 : 0;
    else if (z === 1) tz = Math.random() < 0.6 ? 2 : 1;
    else tz = Math.random() < 0.7 ? 2 : 1;
    let mates = this.inZone(side, tz).filter(p => p !== c);
    if (!mates.length) { tz = 1; mates = this.active(side).filter(p => p !== c && !this.isGK(p)); }
    const recv = pick(mates);
    const def = pick(this.inZone(opp, 2 - tz));
    const forward = tz > z;

    const atk = this.eff(c, 'Pass') + Math.random() * 10 + 3 - (forward ? 2 : 0) + (this.isGK(c) ? 2 : 0) + this.mod(side, 'atk') + this.sup(side, tz);
    const dfn = this.eff(def, 'Tackle') + Math.random() * 10 + this.mod(opp, 'def');
    const vars = { a: c, b: recv, d: def };

    if (atk >= dfn) {
      this.st(c).passOk++;
      this.carrier = recv; this.zone = tz;
      this.setEv({ kind: 'pass', a: c, b: recv, d: def });
      this.log('', this.isGK(c) ? 'gkPass' : forward ? 'passFwd' : 'passOk', vars, side);
    } else {
      this.st(c).passFail++;
      this.st(def).tackles++;
      this.log('turn', 'passFail', vars, side);
      this.turnover(def, 2 - tz);
      this.setEv({ kind: 'intercept', a: c, b: recv, d: def });
    }
  }

  doDribble() {
    const c = this.carrier, side = this.poss, opp = 1 - side, z = this.zone;
    const def = pick(this.inZone(opp, 2 - z));
    const atk = (this.eff(c, 'Dribble') + this.eff(c, 'Speed')) / 2 + Math.random() * 10 + 1 + this.mod(side, 'atk') + this.sup(side, z);
    const dfn = this.eff(def, 'Tackle') + Math.random() * 10 + this.mod(opp, 'def');
    const vars = { a: c, d: def };

    if (atk >= dfn) {
      this.st(c).dribbleOk++;
      this.st(def).tacklesLost++;
      if (z < 2) this.zone++; else this.boxBonus = 3;
      this.setEv({ kind: 'dribble', a: c, d: def });
      this.log('', 'drOk', vars, side);
      if ((def.tags || []).includes('Aggressive')) this.commitFoul(def, c, side);
    } else {
      this.st(c).dribbleFail++;
      this.st(def).tackles++;
      this.log('turn', 'drFail', vars, side);
      this.turnover(def, 2 - z);
      this.setEv({ kind: 'tackle', a: c, d: def });
    }
  }

  /** "Aggressive" downside: a lost tackle is always a foul + yellow. Two yellows = red. */
  commitFoul(def, victim, attSide) {
    const defSide = 1 - attSide;
    const s = this.st(def);
    s.yellow++;
    this.setEv({ kind: 'foul', a: victim, d: def });
    this.log('foul', 'foul', { a: victim, d: def }, defSide);
    if (s.yellow >= 2) {
      s.red = 1;
      this.sentOff.add(def.id);
      this.hold = 1;
      this.log('red', 'red', { d: def, n: this.active(defSide).length }, defSide);
    }
    if (this.zone === 2 && Math.random() < 0.5) this.startShot(victim, true);
  }

  startShot(c, freeKick) {
    const side = this.poss;
    const long = !freeKick && this.zone < 2;
    this.st(c).shots++;
    this.pendingShot = { shooter: c, side, long, freeKick, bonus: freeKick ? 1 : this.boxBonus, phase: 1 };
    this.boxBonus = 0;
    this.setEv({ kind: 'aim', a: c, side });
    this.log('shot', freeKick ? 'fkAim' : long ? 'aimLong' : 'aim', { a: c }, side);
  }

  resolveShot() {
    const { shooter, side, long, bonus } = this.pendingShot;
    this.pendingShot = null;
    const opp = 1 - side;
    const blocker = pick(this.inZone(opp, 0));
    const keeper = this.keeper(opp);

    if (Math.random() < 0.2 &&
        this.eff(blocker, 'Tackle') + Math.random() * 10 + this.mod(opp, 'def') > this.eff(shooter, 'Shoot') + Math.random() * 10 + this.mod(side, 'atk')) {
      this.st(blocker).tackles++;
      this.log('turn', 'block', { d: blocker }, opp);
      this.turnover(blocker, 0);
      this.setEv({ kind: 'block', d: blocker });
      return;
    }
    const atk = this.eff(shooter, 'Shoot') + Math.random() * 10 + bonus - (long ? 5 : 0) + this.mod(side, 'atk');
    const dfn = this.eff(keeper, 'Save') + Math.random() * 10 + 4 + this.mod(opp, 'def');
    const vars = { a: shooter, k: keeper };

    if (atk > dfn) {
      this.st(shooter).goals++; this.st(shooter).onTarget++;
      this.sides[side].score++;
      this.log('goal', 'goal', vars, side, `  ${this.sides[0].score}-${this.sides[1].score}`);
      this.hooks.onGoal?.(side);
      this.kickoff(opp);
      this.hold = 1;   // celebration beat
      this.setEv({ kind: 'goal', side, a: shooter });
    } else if (atk < dfn - 7) {
      this.log('', 'wide', vars, side);
      this.turnover(keeper, 0);
      this.setEv({ kind: 'wide', side, a: shooter });
    } else {
      this.st(shooter).onTarget++;
      this.st(keeper).saves++;
      this.log('', 'save', vars, opp);
      this.turnover(keeper, 0);
      this.setEv({ kind: 'save', k: keeper });
    }
  }

  /* ---------- reporting ---------- */
  log(type, key, vars = {}, side = -1, suffix = '') {
    this.hooks.onLog({ minute: this.minute, type, key, vars, side, suffix, r: Math.random() });
  }

  teamTotals(side = 0) {
    const t = MatchEngine.blankStats();
    for (const p of this.sides[side].players) { const s = this.st(p); for (const k in t) t[k] += s[k]; }
    return t;
  }
}

/* =========================================================
   RADAR VIEW — static tactics board (click / drag dots). The live match uses MatchView below.
   Coordinates are % of the pitch. Home attacks left -> right.
   ========================================================= */
class RadarView {
  static LINES = `
    <div class="pl-line half"></div><div class="pl-line third t1"></div><div class="pl-line third t2"></div>
    <div class="pl-line circle"></div><div class="pl-line spot"></div>
    <div class="pl-line box l"></div><div class="pl-line box r"></div>
    <div class="pl-line six l"></div><div class="pl-line six r"></div>
    <div class="pl-goal l"></div><div class="pl-goal r"></div>`;

  constructor(el, { labels = false, onDotClick = null, onDrop = null } = {}) {
    this.el = el;
    this.labels = labels;
    this.onDotClick = onDotClick;
    this.onDrop = onDrop;
    this.dots = new Map();
    this.ball = null;
    this.lastSeq = -1;
  }

  /** sides: [{ entries: [{p, x, y, line}] }, ...]  (index 0 = home/blue, 1 = away/red) */
  setup(sides, { board = false } = {}) {
    this.el.innerHTML = RadarView.LINES;
    this.dots.clear();
    this.lastSeq = -1;
    sides.forEach((side, si) => side.entries.forEach((e, idx) => {
      const d = document.createElement(this.onDotClick ? 'button' : 'div');
      d.className = `pl ${si === 0 ? 'home' : 'away'}${e.line === 'GK' ? ' gk' : ''}`;
      d.innerHTML = `<b>${e.p.number ?? idx + 1}</b>${this.labels ? `<span class="pl-pos ${e.p.position}">${L.pos(e.p.position)}</span><span class="pl-nm">${esc(L.name(e.p.surname))}</span>` : ''}`;
      d.title = `${L.name(e.p.name)} · ${L.line(e.line === 'GK' ? 'GK' : e.line)}`;
      if (this.onDotClick) { d.type = 'button'; d.dataset.slot = idx; d.addEventListener('click', () => this.onDotClick(idx)); }
      if (this.onDrop) {
        d.draggable = true;
        d.addEventListener('dragstart', ev => { ev.dataTransfer.setData('text/plain', e.p.id); ev.dataTransfer.effectAllowed = 'move'; });
        d.addEventListener('dragover', ev => { ev.preventDefault(); d.classList.add('drop-over'); });
        d.addEventListener('dragleave', () => d.classList.remove('drop-over'));
        d.addEventListener('drop', ev => { ev.preventDefault(); d.classList.remove('drop-over'); this.onDrop(idx, ev.dataTransfer.getData('text/plain')); });
      }
      this.el.appendChild(d);
      // base position (away mirrored); the tactics board spreads the shape over the whole pitch
      const bx = board ? (e.line === 'GK' ? 5 : 5 + (e.x - 5) * 1.9) : e.x;
      const base = si === 0 ? { x: bx, y: e.y } : { x: 100 - bx, y: 100 - e.y };
      this.dots.set(e.p.id, { el: d, base, side: si });
      this.place(d, base.x, base.y);
    }));
    if (!board) {
      this.ball = document.createElement('div');
      this.ball.className = 'ball';
      this.el.appendChild(this.ball);
      this.place(this.ball, 50, 50);
    } else this.ball = null;
  }

  place(el, x, y) { el.style.left = x + '%'; el.style.top = y + '%'; }
  select(id) { this.highlight(id); }
  /** sel = the chosen player; clsFor(id) returns 'suggested-swap' | 'dimmed-swap' | '' for every other dot. */
  highlight(selId, clsFor) {
    for (const [pid, d] of this.dots) {
      d.el.classList.toggle('sel', pid === selId);
      d.el.classList.remove('suggested-swap', 'dimmed-swap');
      const c = selId && clsFor ? clsFor(pid) : '';
      if (c) d.el.classList.add(c);
    }
  }
}
