class Lang {
  static KEY = 'yam_lang';
  constructor() {
    let saved = null;
    try { saved = localStorage.getItem(Lang.KEY); } catch (e) {}
    this.code = saved === 'en' || saved === 'ru' ? saved : 'ru';
  }
  set(code) { this.code = code; try { localStorage.setItem(Lang.KEY, code); } catch (e) {} }
  t(key, vars = {}) {
    const v = I18N[this.code][key] ?? I18N.en[key] ?? key;
    return typeof v === 'string' ? fmt(v, vars) : v;
  }
  name(full) { return this.code === 'ru' ? full.split(' ').map(w => RU_NAMES[w] || w).join(' ') : full; }
  team(n) { return this.code === 'ru' ? (RU_TEAMS[n] || n) : n; }
  pos(p) { return POS_LABEL[this.code][p] || p; }
  line(l) { return this.pos(LINE_POS[l]); }
  tag(key) { return TAGS[key] ? TAGS[key][this.code][0] : key; }
  tagDesc(key) { return TAGS[key] ? TAGS[key][this.code][1] : ''; }
  locale() { return this.code === 'ru' ? 'ru-RU' : 'en-GB'; }
}
const L = new Lang();

/* =========================================================
   PLAYER
   ========================================================= */
class Player {
  constructor({ id, name, position, attrs, tags, energy, number }) {
    this.id = id;
    this.name = name;
    this.position = position;
    this.number = number;
    this.attrs = attrs;              // HIDDEN — never rendered
    if (tags) {                      // only the academy squad carries tags + energy
      this.tags = tags;
      this.energy = energy ?? 100;
    }
  }
  get surname() { return this.name.split(' ').slice(-1)[0]; }

  static generate(id, position, usedSurnames, mod = 0, withTags = false, number = 0) {
    let last; let guard = 0;
    do { last = pick(LAST); } while (usedSurnames.has(last) && guard++ < 200);
    usedSurnames.add(last);
    const attrs = {};
    for (const a of ATTRS) { const [lo, hi] = PROFILES[position][a]; attrs[a] = clamp(rnd(lo, hi) + mod, 1, 20); }
    return new Player({ id, name: `${pick(FIRST)} ${last}`, position, attrs, number, tags: withTags ? [] : undefined });
  }
}

/* =========================================================
   GAME STATE
   lineup[i] is the player in formation slot i (slot 0 = goalkeeper).
   ========================================================= */
class GameState {
  static KEY = 'yam_save_v1';

  constructor() {
    if (!this.load()) this.newAcademy();
    this.opponent = this.makeOpponent();
    this.lastReport = null;
    this.notebookUnlocked = false;
  }

  newAcademy() {
    this.clubName = CLUB_NAME;
    this.formation = '4-4-2';
    const used = new Set();
    this.squad = SQUAD_POS.map((pos, i) => Player.generate(`a${i}`, pos, used, 0, true, i + 1));
    this.lineup = this.squad.slice(0, 11).map(p => p.id);
    this.autoArrange();
    this.record = { w: 0, d: 0, l: 0, gf: 0, ga: 0 };
    this.fixture = 1;
    this.save();
  }

  makeOpponent() {
    const used = new Set(this.squad.map(p => p.surname));
    const strength = rnd(-2, 2);
    const formation = pick(FORMATION_KEYS);
    return {
      name: OPPONENTS[(this.fixture - 1) % OPPONENTS.length],
      formation,
      players: formationSlots(formation).map((s, i) => Player.generate(`b${this.fixture}_${i}`, LINE_POS[s.line], used, strength, false, i + 1)),
    };
  }

  player(id) { return this.squad.find(p => p.id === id); }
  isStarter(id) { return this.lineup.includes(id); }
  starters() { return this.lineup.map(id => this.player(id)); }
  bench() { return this.squad.filter(p => !this.isStarter(p.id)); }
  slots() { return formationSlots(this.formation); }
  slotLine(id) { const i = this.lineup.indexOf(id); return i < 0 ? null : this.slots()[i].line; }
  outOfPosition() {
    const slots = this.slots();
    return this.starters().map((p, i) => ({ p, line: slots[i].line })).filter(({ p, line }) => NATURAL_LINE[p.position] !== line);
  }

  static gkError(players) { return players.filter(p => p.position === 'GK').length !== 1 ? 'gk' : null; }

  /** Put the GK in slot 0, then fill each slot with the best natural fit (ties: higher energy). */
  autoArrange() {
    const slots = this.slots();
    const pool = this.starters();
    const gk = pool.find(p => p.position === 'GK') || pool[0];
    const rest = pool.filter(p => p !== gk).sort((a, b) => b.energy - a.energy);
    const out = [gk.id];
    const free = [...rest];
    const assigned = new Array(slots.length).fill(null);
    // pass 1: exact matches
    slots.forEach((s, i) => {
      if (i === 0) return;
      const k = free.findIndex(p => NATURAL_LINE[p.position] === s.line);
      if (k >= 0) assigned[i] = free.splice(k, 1)[0];
    });
    // pass 2: nearest line for the rest
    slots.forEach((s, i) => {
      if (i === 0 || assigned[i]) return;
      free.sort((a, b) => Math.abs((LINE_IDX[NATURAL_LINE[a.position]] ?? 1) - LINE_IDX[s.line]) - Math.abs((LINE_IDX[NATURAL_LINE[b.position]] ?? 1) - LINE_IDX[s.line]));
      assigned[i] = free.shift();
    });
    for (let i = 1; i < slots.length; i++) out.push(assigned[i].id);
    this.lineup = out;
  }

  setFormation(f) {
    if (!FORMATIONS[f]) return;
    this.formation = f;
    this.autoArrange();
    this.save();
  }

  swapSlots(i, j) {
    if (i === 0 || j === 0) return 'gk';
    [this.lineup[i], this.lineup[j]] = [this.lineup[j], this.lineup[i]];
    this.save();
    return null;
  }

  /** Substitution: bench player takes the starter's slot. Returns an error key or null. */
  swap(a, b) {
    const [s, bn] = this.isStarter(a) ? [a, b] : [b, a];
    if (!this.isStarter(s) || this.isStarter(bn)) return 'gk';
    const next = this.lineup.map(id => (id === s ? bn : id));
    if (GameState.gkError(next.map(id => this.player(id)))) return 'gk';
    this.lineup = next;
    this.save();
    return null;
  }

  setTag(id, tag) { const p = this.player(id); if (p && TAGS[tag]) { p.tags = [tag]; this.save(); } }
  removeTag(id, tag) { const p = this.player(id); if (p) { p.tags = p.tags.filter(t => t !== tag); this.save(); } }

  applyFatigue(playedIds) {
    for (const p of this.squad) {
      const played = playedIds.includes(p.id);
      const delta = played ? -rnd(ENERGY.PLAY_MIN, ENERGY.PLAY_MAX) : ENERGY.BENCH_REST;
      p.energy = clamp(Math.round(p.energy + delta + ENERGY.WEEK_REST), 0, 100);
    }
    this.save();
  }

  recordResult(gf, ga) {
    this.record.gf += gf; this.record.ga += ga;
    if (gf > ga) this.record.w++; else if (gf === ga) this.record.d++; else this.record.l++;
    this.fixture++;
    this.save();
  }

  save() {
    try {
      localStorage.setItem(GameState.KEY, JSON.stringify({ v: 3, clubName: this.clubName, formation: this.formation, squad: this.squad, lineup: this.lineup, record: this.record, fixture: this.fixture }));
    } catch (e) { /* storage unavailable: play in memory */ }
  }
  load() {
    try {
      const raw = localStorage.getItem(GameState.KEY);
      if (!raw) return false;
      const d = JSON.parse(raw);
      if (!Array.isArray(d.squad) || d.squad.length < 11) return false;
      this.clubName = d.clubName || CLUB_NAME;
      this.formation = FORMATIONS[d.formation] ? d.formation : '4-4-2';
      this.squad = d.squad.map(p => new Player({ ...p, tags: (Array.isArray(p.tags) ? p.tags : []).filter(t => TAGS[t]).slice(0, 1) }));
      if (this.squad.length === 11) { // migrate v1 saves: add a bench
        const used = new Set(this.squad.map(p => p.surname));
        SQUAD_POS.slice(11).forEach((pos, i) => this.squad.push(Player.generate(`a${11 + i}`, pos, used, 0, true)));
      }
      // jersey numbers for older saves
      const taken = new Set(this.squad.map(p => p.number).filter(Boolean));
      let n = 1;
      for (const p of this.squad) if (!p.number) { while (taken.has(n)) n++; p.number = n; taken.add(n); }
      const ok = Array.isArray(d.lineup) && d.lineup.length === 11 && d.lineup.every(id => this.player(id))
        && !GameState.gkError(d.lineup.map(id => this.player(id)));
      this.lineup = ok ? d.lineup : this.squad.slice(0, 11).map(p => p.id);
      if (d.v !== 3 || this.player(this.lineup[0]).position !== 'GK') this.autoArrange();
      this.record = d.record || { w: 0, d: 0, l: 0, gf: 0, ga: 0 };
      this.fixture = d.fixture || 1;
      this.save();
      return true;
    } catch (e) { return false; }
  }
  reset() {
    try { localStorage.removeItem(GameState.KEY); } catch (e) {}
    this.newAcademy();
    this.opponent = this.makeOpponent();
    this.lastReport = null;
    this.notebookUnlocked = false;
  }
}

/* =========================================================
   MATCH ENGINE
   Zones are relative to the team in possession:
   0 = own defensive third, 1 = midfield, 2 = attacking third.
   Who plays in a zone is decided by the FORMATION slot (DEF/MID/ATT line),
   not by the player's natural position.
   ========================================================= */
class MatchEngine {
  static SPEED = { 1: 600, 2: 200, 5: 20 };  // ms per in-game minute
  static HIGHLIGHT = 1200;                    // ms per beat of a shot sequence (aim -> strike -> outcome)

  constructor(home, away, hooks, opts = {}) {
    this.sides = [MatchEngine.buildSide(home, true), MatchEngine.buildSide(away, false)];
    this.hooks = hooks;
    this.minute = 0;
    this.stats = new Map();
    this.lineOf = new Map();
    for (const s of this.sides) for (const e of s.entries) { this.stats.set(e.p.id, MatchEngine.blankStats()); this.lineOf.set(e.p.id, e.line); }
    // Energy is checked once, at kick-off: under 50% => every hidden stat x0.5 for the whole match
    this.tired = new Set(home.players.filter(p => (p.energy ?? 100) < ENERGY.TIRED).map(p => p.id));
    this.mentality = opts.mentality || 'balanced';
    this.speed = opts.speed || 1;
    this.sentOff = new Set();
    this.timer = null;
    this.delay = 0;
    this.pendingShot = null;
    this.hold = 0;
    this.boxBonus = 0;
    this.started = false;
    this.finished = false;
    this.htLogged = false;
    this.possTicks = [0, 0];
    this.ev = { kind: 'kickoff' };
    this.seq = 0;
  }

  static buildSide(team, user) {
    const slots = formationSlots(team.formation);
    return { name: team.name, formation: team.formation, user, score: 0, players: team.players,
      entries: slots.map((s, i) => ({ ...s, p: team.players[i] })) };
  }
  static blankStats() { return { passOk: 0, passFail: 0, tackles: 0, tacklesLost: 0, shots: 0, onTarget: 0, goals: 0, dribbleOk: 0, dribbleFail: 0, saves: 0, yellow: 0, red: 0 }; }
  st(p) { return this.stats.get(p.id); }
  active(side) { return this.sides[side].players.filter(p => !this.sentOff.has(p.id)); }
  inZone(side, zone) {
    const line = ZONE_LINE[zone];
    const list = this.sides[side].entries.filter(e => e.line === line && !this.sentOff.has(e.p.id)).map(e => e.p);
    return list.length ? list : this.active(side).filter(p => this.lineOf.get(p.id) !== 'GK');
  }
  keeper(side) { return this.sides[side].entries[0].p; }
  isGK(p) { return this.lineOf.get(p.id) === 'GK'; }
  team(side) { return { team: this.sides[side].name }; }
  scoreVars() { return { h: this.team(0), x: this.sides[0].score, y: this.sides[1].score, a: this.team(1) }; }
  setEv(ev) { this.ev = ev; this.seq++; }

  /* ---------- the maths: tags, fatigue, position, shouts, numerical superiority ---------- */
  eff(p, attr) {
    let v = p.attrs[attr];
    if (this.tired.has(p.id)) v *= 0.5;
    if (NATURAL_LINE[p.position] !== this.lineOf.get(p.id)) v *= OUT_OF_POSITION;
    const t = p.tags || [];
    if (t.includes('Aggressive') && attr === 'Tackle') v *= 1.5;
    if (t.includes('Playmaker') && attr === 'Pass') v *= 1.5;
    if (t.includes('Selfish') && (attr === 'Dribble' || attr === 'Shoot')) v *= 1.5;
    return v;
  }
  mod(side, role) {
    if (side !== 0 || this.mentality === 'balanced') return 0;
    const pushing = this.mentality === 'attack';
    return (role === 'atk') === pushing ? 3 : -3;
  }
  counts(side) {
    const c = { DEF: 0, MID: 0, ATT: 0 };
    for (const e of this.sides[side].entries) if (e.line !== 'GK' && !this.sentOff.has(e.p.id)) c[e.line]++;
    return c;
  }
  /** Bonus for the team in possession `side` contesting zone z (red cards count too). */
  sup(side, z) {
    const diff = presence(this.counts(side), z) - presence(this.counts(1 - side), 2 - z);
    return clamp((diff - SUP_BASE[z]) * SUP_SCALE, -4, 4);
  }
  setMentality(m) {
    if (m === this.mentality) return;
    this.mentality = m;
    if (!this.finished && this.started) this.log('coach', 'eng.shout.' + m, {}, 0);
  }
  setSpeedMode(s) { this.speed = s; if (this.started && !this.finished) this.updateSpeed(); }

  /* ---------- clock & pacing ---------- */
  start() {
    this.started = true;
    this.kickoff(0);
    this.log('whistle', 'eng.kickoff', { a: this.team(0) }, 0);
    this.updateSpeed();
    this.hooks.onUpdate(this);
  }
  /* Highlight pacing: a shot sequence is ALWAYS played slowly, whatever the chosen speed. */
  desiredDelay() {
    if (this.pendingShot || this.hold > 0) return MatchEngine.HIGHLIGHT;
    return MatchEngine.SPEED[this.speed] ?? 600;
  }
  updateSpeed() {
    const d = this.desiredDelay();
    if (d === this.delay && this.timer) return;
    this.delay = d;
    clearInterval(this.timer);
    this.timer = setInterval(() => this.tick(), d);
    this.hooks.onSpeed?.(d);
  }
  get highlight() { return this.delay >= MatchEngine.HIGHLIGHT; }
  stop() { clearInterval(this.timer); this.timer = null; }

  tick() {
    if (this.finished) return;
    if (this.hold > 0) this.hold--;
    if (this.pendingShot) {
      const ps = this.pendingShot;
      if (ps.phase === 1) {
        ps.phase = 2;
        this.setEv({ kind: 'strike', a: ps.shooter, side: ps.side });
        this.log('shot', 'strike', { a: ps.shooter }, ps.side);
      } else this.resolveShot();
      this.afterAction();
      return;
    }
    this.minute++;
    if (this.minute === 46) {
      this.kickoff(1);
      this.log('whistle', 'eng.second', { a: this.team(1) }, 1);
    }
    this.possTicks[this.poss]++;
    this.act();
    this.afterAction();
  }

  afterAction() {
    if (!this.pendingShot) {
      if (this.minute >= 45 && !this.htLogged) { this.htLogged = true; this.log('whistle', 'eng.ht', this.scoreVars()); }
      if (this.minute >= 90) { this.finish(); return; }
    }
    this.updateSpeed();
    this.hooks.onUpdate(this);
  }

  finish() {
    this.stop();
    this.finished = true;
    this.log('whistle', 'eng.ft', this.scoreVars());
    this.hooks.onUpdate(this);
    this.hooks.onEnd(this);
  }

  /* ---------- possession helpers ---------- */
  kickoff(side) {
    this.poss = side;
    this.zone = 1;
    this.carrier = pick(this.inZone(side, 1));
    this.boxBonus = 0;
    this.setEv({ kind: 'kickoff' });
  }
  turnover(newCarrier, zone) {
    this.poss = 1 - this.poss;
    this.carrier = newCarrier;
    this.zone = zone;
    this.boxBonus = 0;
  }

  /* ---------- decision (tags bend the AI) ---------- */
  chooseAction() {
    const c = this.carrier;
    if (this.isGK(c)) return 'pass';
    const w = { ...[
      { pass: 80, dribble: 20, shoot: 0 },
      { pass: 60, dribble: 32, shoot: 8 },
      this.lineOf.get(c.id) === 'ATT' ? { pass: 28, dribble: 22, shoot: 50 } : { pass: 38, dribble: 27, shoot: 35 },
    ][this.zone] };
    const t = c.tags || [];
    if (t.includes('Playmaker')) { w.pass *= 2; w.dribble *= 0.4; }
    if (t.includes('Selfish')) {
      w.pass *= 0.08; w.dribble *= 1.6; w.shoot *= 1.8;
      if (this.zone === 1) w.shoot = Math.max(w.shoot, 22);
    }
    let r = Math.random() * (w.pass + w.dribble + w.shoot);
    for (const [action, weight] of Object.entries(w)) { if ((r -= weight) < 0) return action; }
    return 'pass';
  }

  act() {
    const action = this.chooseAction();
    if (action === 'pass') this.doPass();
    else if (action === 'dribble') this.doDribble();
    else this.startShot(this.carrier, false);
    if (!this.pendingShot && Math.random() < 0.04) this.log('flavor', 'flavor', {}, -1);
  }

  /* ---------- actions: (attacker stat + rand*10) vs (defender stat + rand*10) + modifiers ---------- */
  doPass() {
    const c = this.carrier, side = this.poss, opp = 1 - side, z = this.zone;
    let tz;
    if (this.isGK(c)) tz = Math.random() < 0.7 ? 0 : 1;
    else if (z === 0) tz = Math.random() < 0.65 ? 1 : 0;
    else if (z === 1) tz = Math.random() < 0.6 ? 2 : 1;
    else tz = Math.random() < 0.7 ? 2 : 1;
    let mates = this.inZone(side, tz).filter(p => p !== c);
    if (!mates.length) { tz = 1; mates = this.active(side).filter(p => p !== c && !this.isGK(p)); }
    const recv = pick(mates);
    const def = pick(this.inZone(opp, 2 - tz));
    const forward = tz > z;

    const atk = this.eff(c, 'Pass') + Math.random() * 10 + 3 - (forward ? 2 : 0) + (this.isGK(c) ? 2 : 0) + this.mod(side, 'atk') + this.sup(side, tz);
    const dfn = this.eff(def, 'Tackle') + Math.random() * 10 + this.mod(opp, 'def');
    const vars = { a: c, b: recv, d: def };

    if (atk >= dfn) {
      this.st(c).passOk++;
      this.carrier = recv; this.zone = tz;
      this.setEv({ kind: 'pass', a: c, b: recv, d: def });
      this.log('', this.isGK(c) ? 'gkPass' : forward ? 'passFwd' : 'passOk', vars, side);
    } else {
      this.st(c).passFail++;
      this.st(def).tackles++;
      this.log('turn', 'passFail', vars, side);
      this.turnover(def, 2 - tz);
      this.setEv({ kind: 'intercept', a: c, b: recv, d: def });
    }
  }

  doDribble() {
    const c = this.carrier, side = this.poss, opp = 1 - side, z = this.zone;
    const def = pick(this.inZone(opp, 2 - z));
    const atk = (this.eff(c, 'Dribble') + this.eff(c, 'Speed')) / 2 + Math.random() * 10 + 1 + this.mod(side, 'atk') + this.sup(side, z);
    const dfn = this.eff(def, 'Tackle') + Math.random() * 10 + this.mod(opp, 'def');
    const vars = { a: c, d: def };

    if (atk >= dfn) {
      this.st(c).dribbleOk++;
      this.st(def).tacklesLost++;
      if (z < 2) this.zone++; else this.boxBonus = 3;
      this.setEv({ kind: 'dribble', a: c, d: def });
      this.log('', 'drOk', vars, side);
      if ((def.tags || []).includes('Aggressive')) this.commitFoul(def, c, side);
    } else {
      this.st(c).dribbleFail++;
      this.st(def).tackles++;
      this.log('turn', 'drFail', vars, side);
      this.turnover(def, 2 - z);
      this.setEv({ kind: 'tackle', a: c, d: def });
    }
  }

  /** "Aggressive" downside: a lost tackle is always a foul + yellow. Two yellows = red. */
  commitFoul(def, victim, attSide) {
    const defSide = 1 - attSide;
    const s = this.st(def);
    s.yellow++;
    this.setEv({ kind: 'foul', a: victim, d: def });
    this.log('foul', 'foul', { a: victim, d: def }, defSide);
    if (s.yellow >= 2) {
      s.red = 1;
      this.sentOff.add(def.id);
      this.hold = 1;
      this.log('red', 'red', { d: def, n: this.active(defSide).length }, defSide);
    }
    if (this.zone === 2 && Math.random() < 0.5) this.startShot(victim, true);
  }

  startShot(c, freeKick) {
    const side = this.poss;
    const long = !freeKick && this.zone < 2;
    this.st(c).shots++;
    this.pendingShot = { shooter: c, side, long, freeKick, bonus: freeKick ? 1 : this.boxBonus, phase: 1 };
    this.boxBonus = 0;
    this.setEv({ kind: 'aim', a: c, side });
    this.log('shot', freeKick ? 'fkAim' : long ? 'aimLong' : 'aim', { a: c }, side);
  }

  resolveShot() {
    const { shooter, side, long, bonus } = this.pendingShot;
    this.pendingShot = null;
    const opp = 1 - side;
    const blocker = pick(this.inZone(opp, 0));
    const keeper = this.keeper(opp);

    if (Math.random() < 0.2 &&
        this.eff(blocker, 'Tackle') + Math.random() * 10 + this.mod(opp, 'def') > this.eff(shooter, 'Shoot') + Math.random() * 10 + this.mod(side, 'atk')) {
      this.st(blocker).tackles++;
      this.log('turn', 'block', { d: blocker }, opp);
      this.turnover(blocker, 0);
      this.setEv({ kind: 'block', d: blocker });
      return;
    }
    const atk = this.eff(shooter, 'Shoot') + Math.random() * 10 + bonus - (long ? 5 : 0) + this.mod(side, 'atk');
    const dfn = this.eff(keeper, 'Save') + Math.random() * 10 + 4 + this.mod(opp, 'def');
    const vars = { a: shooter, k: keeper };

    if (atk > dfn) {
      this.st(shooter).goals++; this.st(shooter).onTarget++;
      this.sides[side].score++;
      this.log('goal', 'goal', vars, side, `  ${this.sides[0].score}-${this.sides[1].score}`);
      this.hooks.onGoal?.(side);
      this.kickoff(opp);
      this.hold = 1;   // celebration beat
      this.setEv({ kind: 'goal', side, a: shooter });
    } else if (atk < dfn - 7) {
      this.log('', 'wide', vars, side);
      this.turnover(keeper, 0);
      this.setEv({ kind: 'wide', side, a: shooter });
    } else {
      this.st(shooter).onTarget++;
      this.st(keeper).saves++;
      this.log('', 'save', vars, opp);
      this.turnover(keeper, 0);
      this.setEv({ kind: 'save', k: keeper });
    }
  }

  /* ---------- reporting ---------- */
  log(type, key, vars = {}, side = -1, suffix = '') {
    this.hooks.onLog({ minute: this.minute, type, key, vars, side, suffix, r: Math.random() });
  }

  teamTotals(side = 0) {
    const t = MatchEngine.blankStats();
    for (const p of this.sides[side].players) { const s = this.st(p); for (const k in t) t[k] += s[k]; }
    return t;
  }
}

/* =========================================================
   RADAR VIEW — 2D pitch with player dots (Subbuteo / classic FM radar)
   Coordinates are % of the pitch. Home attacks left -> right.
   ========================================================= */
class RadarView {
  static LINES = `
    <div class="pl-line half"></div><div class="pl-line third t1"></div><div class="pl-line third t2"></div>
    <div class="pl-line circle"></div><div class="pl-line spot"></div>
    <div class="pl-line box l"></div><div class="pl-line box r"></div>
    <div class="pl-line six l"></div><div class="pl-line six r"></div>
    <div class="pl-goal l"></div><div class="pl-goal r"></div>`;

  constructor(el, { labels = false, onDotClick = null } = {}) {
    this.el = el;
    this.labels = labels;
    this.onDotClick = onDotClick;
    this.dots = new Map();
    this.ball = null;
    this.lastSeq = -1;
  }

  /** sides: [{ entries: [{p, x, y, line}] }, ...]  (index 0 = home/blue, 1 = away/red) */
  setup(sides, { board = false } = {}) {
    this.el.innerHTML = RadarView.LINES;
    this.dots.clear();
    this.lastSeq = -1;
    sides.forEach((side, si) => side.entries.forEach((e, idx) => {
      const d = document.createElement(this.onDotClick ? 'button' : 'div');
      d.className = `pl ${si === 0 ? 'home' : 'away'}${e.line === 'GK' ? ' gk' : ''}`;
      d.innerHTML = `<b>${e.p.number ?? idx + 1}</b>${this.labels ? `<span class="pl-nm">${esc(L.name(e.p.surname))}</span>` : ''}`;
      d.title = `${L.name(e.p.name)} · ${L.line(e.line === 'GK' ? 'GK' : e.line)}`;
      if (this.onDotClick) { d.type = 'button'; d.dataset.slot = idx; d.addEventListener('click', () => this.onDotClick(idx)); }
      this.el.appendChild(d);
      // base position (away mirrored); the tactics board spreads the shape over the whole pitch
      const bx = board ? (e.line === 'GK' ? 5 : 5 + (e.x - 5) * 1.9) : e.x;
      const base = si === 0 ? { x: bx, y: e.y } : { x: 100 - bx, y: 100 - e.y };
      this.dots.set(e.p.id, { el: d, base, side: si });
      this.place(d, base.x, base.y);
    }));
    if (!board) {
      this.ball = document.createElement('div');
      this.ball.className = 'ball';
      this.el.appendChild(this.ball);
      this.place(this.ball, 50, 50);
    } else this.ball = null;
  }

  place(el, x, y) { el.style.left = x + '%'; el.style.top = y + '%'; }
  setTransition(sec) { this.el.style.setProperty('--mv', sec + 's'); }
  select(id) { for (const [pid, d] of this.dots) d.el.classList.toggle('sel', pid === id); }

  /** Called after every engine update. Recomputes positions only when a new event happened. */
  render(eng) {
    if (eng.seq === this.lastSeq) return;
    this.lastSeq = eng.seq;
    const ev = eng.ev || {};
    const dir = eng.poss === 0 ? 1 : -1;
    const carrier = eng.carrier;
    const cd = this.dots.get(carrier.id);

    // 1) where is the ball?
    let bx, by;
    if (ev.kind === 'kickoff') { bx = 50; by = 50; }
    else if (ev.kind === 'goal') { bx = ev.side === 0 ? 100.6 : -0.6; by = 46 + Math.random() * 8; }
    else if (ev.kind === 'wide') { bx = ev.side === 0 ? 103 : -3; by = Math.random() < 0.5 ? 30 : 70; }
    else if (eng.isGK(carrier)) { bx = eng.poss === 0 ? 7 : 93; by = 50 + jit(6); }
    else {
      const zx = [20, 50, 78][eng.zone] + jit(7);
      bx = eng.poss === 0 ? zx : 100 - zx;
      by = clamp((cd ? cd.base.y : 50) * 0.7 + 15 + jit(6), 8, 92);
      if (ev.kind === 'aim' || ev.kind === 'strike') bx = eng.poss === 0 ? Math.max(bx, 70) : Math.min(bx, 30);
    }
    if (ev.kind === 'strike') { const gx = ev.side === 0 ? 97 : 3; bx = lerp(bx, gx, 0.45); by = lerp(by, 50, 0.4); }

    // 2) whole teams slide with the ball (block shifting)
    const shift = clamp((clamp(bx, 0, 100) - 50) * 0.4, -14, 14);
    for (const [id, d] of this.dots) {
      if (eng.sentOff.has(id)) { d.el.classList.add('off'); continue; }
      const gk = eng.isGK({ id });
      let x = d.base.x + (gk ? shift * 0.12 : shift) + jit(1.5);
      let y = d.base.y + jit(1.5);
      x = gk ? clamp(x, 2, 98) : clamp(x, 6, 94);
      d.x = x; d.y = y;
    }
    // 3) involved players react
    const towards = (p, t, off = 0) => { const d = p && this.dots.get(p.id); if (!d || eng.sentOff.has(p.id)) return; d.x = lerp(d.x, bx - off, t); d.y = lerp(d.y, by, t); };
    if (ev.d) towards(ev.d, ev.kind === 'dribble' || ev.kind === 'pass' ? 0.55 : 0.85, -dir * 2);
    if (ev.kind === 'intercept' && ev.b) towards(ev.b, 0.35);
    if (cd && ev.kind !== 'goal' && ev.kind !== 'wide') { cd.x = bx - dir * 1.4; cd.y = by + 1.2; }
    if (ev.kind === 'goal' || ev.kind === 'wide') towards(ev.a, 0.3);

    for (const [id, d] of this.dots) {
      if (eng.sentOff.has(id)) continue;
      this.place(d.el, d.x, d.y);
      d.el.classList.toggle('has', id === carrier.id && ev.kind !== 'goal' && !eng.finished);
    }
    this.place(this.ball, bx, by);
  }
}

/* =========================================================
   UI CONTROLLER
   ========================================================= */
class UIController {
  constructor(state) {
    this.state = state;
    this.engine = null;
    this.view = 'office';
    this.logEntries = [];
    this.selected = null;        // squad screen: player picked for a substitution
    this.selSlot = null;         // tactics board: slot picked for a swap
    this.mentality = 'balanced';
    this.speed = 1;
    try { const s = Number(localStorage.getItem('yam_speed')); if (MatchEngine.SPEED[s]) this.speed = s; } catch (e) {}
    this.pitchIdx = rnd(0, 3);
    this.$ = id => document.getElementById(id);
    this.radar = new RadarView(this.$('radar'));
    this.board = new RadarView(this.$('tac-board'), { labels: true, onDotClick: i => this.onBoardClick(i) });
    this.bind();
    this.applyStatic();
    this.fillFormations();
    this.renderAll();
    this.prepareMatch();
    this.tickClock(); setInterval(() => this.tickClock(), 15000);
    this.show('office');
  }

  renderAll() {
    this.renderOffice();
    this.renderSquad();
    this.renderTactics();
    this.renderNotebook();
    this.syncLocks();
    this.renderShouts();
    this.renderSpeedBtns();
  }

  /* ---------- language ---------- */
  applyStatic() {
    document.documentElement.lang = L.code;
    document.title = L.t('doc.title');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = L.t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-aria]').forEach(el => { const v = L.t(el.dataset.i18nAria); el.setAttribute('aria-label', v); el.title = v; });
    this.$('fx-lbl').textContent = L.t(document.body.classList.contains('fx') ? 'ui.fxOn' : 'ui.fxOff');
    const b = this.$('btn-lang');
    b.textContent = L.code === 'ru' ? 'RU' : 'EN';
    b.title = L.t('ui.lang');
  }

  setLang(code) {
    L.set(code);
    this.applyStatic();
    this.renderAll();
    this.renderMatchChrome();
    if (this.engine) { this.renderLive(this.engine); this.relabelRadar(); } else this.prepareRadar();
    this.rerenderLog();
    this.tickClock();
  }

  relabelRadar() {
    for (const s of this.engine.sides) for (const e of s.entries) {
      const d = this.radar.dots.get(e.p.id);
      if (d) d.el.title = `${L.name(e.p.name)} · ${L.line(e.line)}`;
    }
  }

  v(x) {
    if (x instanceof Player) return L.name(x.surname);
    if (x && typeof x === 'object' && Array.isArray(x.list)) return x.list.map(p => this.v(p)).join(', ');
    if (x && typeof x === 'object' && 'team' in x) return L.team(x.team);
    return String(x);
  }

  entryText(e) {
    const vars = {};
    for (const k in e.vars) vars[k] = this.v(e.vars[k]);
    const pool = TXT[L.code][e.key];
    const text = pool ? fmt(pool[Math.floor(e.r * pool.length)], vars) : L.t(e.key, vars);
    return text + (e.suffix || '');
  }

  /* ---------- navigation ---------- */
  bind() {
    document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => this.show(b.dataset.view)));
    document.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => { this.toggleStart(false); this.show(b.dataset.goto); }));
    document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => this.show('office')));
    this.$('btn-start').addEventListener('click', () => this.onStartButton());
    this.$('btn-startmenu').addEventListener('click', e => { e.stopPropagation(); this.toggleStart(); });
    document.addEventListener('click', e => { if (!e.target.closest('#startmenu')) this.toggleStart(false); });
    const flip = () => this.setLang(L.code === 'ru' ? 'en' : 'ru');
    this.$('btn-lang').addEventListener('click', flip);
    this.$('btn-lang-menu').addEventListener('click', () => { this.toggleStart(false); flip(); });
    try { document.body.classList.toggle('fx', localStorage.getItem('yam_fx') === '1'); } catch (e) {}
    this.$('btn-fx').addEventListener('click', () => {
      const on = document.body.classList.toggle('fx');
      try { localStorage.setItem('yam_fx', on ? '1' : '0'); } catch (e) {}
      this.applyStatic();
    });
    this.$('btn-reset').addEventListener('click', () => {
      this.toggleStart(false);
      if (this.engine && !this.engine.finished) { this.alert(L.t('dlg.finishFirst'), L.t('dlg.academy')); return; }
      this.state.reset(); this.engine = null; this.selected = null; this.selSlot = null;
      this.renderAll(); this.prepareMatch();
      this.alert(L.t('dlg.reset'), L.t('dlg.academy'));
    });
    const closeDlg = () => this.$('dlg').classList.remove('open');
    this.$('dlg-ok').addEventListener('click', closeDlg);
    this.$('dlg-x').addEventListener('click', closeDlg);
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      closeDlg(); this.toggleStart(false); this.selected = null; this.selSlot = null; this.renderSquad(); this.renderTactics();
    });

    // Coach shouts
    document.querySelectorAll('[data-shout]').forEach(b => b.addEventListener('click', () => {
      this.mentality = b.dataset.shout;
      if (this.engine && !this.engine.finished) this.engine.setMentality(this.mentality);
      this.renderShouts();
    }));
    // Simulation speed
    document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => {
      this.speed = Number(b.dataset.speed);
      try { localStorage.setItem('yam_speed', this.speed); } catch (e) {}
      if (this.engine && !this.engine.finished) this.engine.setSpeedMode(this.speed);
      this.renderSpeedBtns();
    }));
    // Tactics
    this.$('formation').addEventListener('change', e => {
      if (this.engine && !this.engine.finished) { e.target.value = this.state.formation; return; }
      this.state.setFormation(e.target.value);
      this.selSlot = null;
      this.afterLineupChange();
    });
    this.$('btn-auto').addEventListener('click', () => {
      if (this.engine && !this.engine.finished) return;
      this.state.autoArrange(); this.state.save(); this.selSlot = null;
      this.afterLineupChange();
    });

    // Squad: remove role / substitutions
    this.$('squad-body').addEventListener('click', e => {
      const rm = e.target.closest('[data-untag]');
      if (rm) { this.state.removeTag(rm.dataset.id, rm.dataset.untag); this.renderSquad(); this.renderNotebook(); return; }
      const sb = e.target.closest('[data-sub]');
      if (sb && !sb.disabled) this.onSubClick(sb.dataset.sub);
    });
    // Notebook: assign role
    this.$('notes-body').addEventListener('click', e => {
      const b = e.target.closest('[data-tag]'); if (!b || b.disabled) return;
      this.state.setTag(b.dataset.id, b.dataset.tag);
      this.renderNotebook(); this.renderSquad(); this.renderOffice();
    });
  }

  afterLineupChange() {
    this.renderTactics();
    this.renderSquad();
    this.renderOffice();
    if (!this.engine) this.prepareMatch();
  }

  toggleStart(force) {
    const m = this.$('startmenu');
    m.classList.toggle('open', force ?? !m.classList.contains('open'));
  }

  show(view) {
    if (view === 'notes' && !this.state.notebookUnlocked) {
      this.alert(L.t('dlg.nbLocked'), L.t('dlg.nbTitle'));
      return;
    }
    this.view = view;
    const scenes = { office: 'scene-office', squad: 'scene-squad', tactics: 'scene-tactics', match: 'scene-match', notes: 'scene-notes' };
    for (const [v, id] of Object.entries(scenes)) this.$(id).classList.toggle('active', v === view);
    for (const v of Object.keys(scenes)) this.$('win-' + v).classList.toggle('open', v === view);
    document.querySelectorAll('.tk[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === view));
    if (view === 'notes') this.$('tk-notes').classList.remove('alert');
    if (view === 'office') this.renderOffice();
  }

  alert(html, title) {
    this.$('dlg-title').textContent = title;
    this.$('dlg-text').innerHTML = html;
    this.$('dlg').classList.add('open');
    this.$('dlg-ok').focus();
  }

  syncLocks() {
    const locked = !this.state.notebookUnlocked;
    this.$('tk-notes').classList.toggle('locked', locked);
    this.$('icon-notes').classList.toggle('locked', locked);
    this.$('tk-notes-lbl').textContent = L.t(locked ? 'nav.notebookLocked' : 'nav.notebook');
  }

  tickClock() {
    const d = new Date();
    this.$('clock').textContent = d.toLocaleTimeString(L.locale(), { hour: '2-digit', minute: '2-digit' });
    this.$('office-date').textContent = d.toLocaleDateString(L.locale(), { weekday: 'short', day: 'numeric', month: 'short' });
  }

  get live() { return !!(this.engine && !this.engine.finished); }

  /* ---------- OFFICE ---------- */
  renderOffice() {
    const s = this.state, r = s.record;
    const tired = s.squad.filter(p => p.energy < ENERGY.TIRED).length;
    this.$('club-name').textContent = L.team(s.clubName);
    this.$('office-kv').innerHTML = `
      <dt>${L.t('office.fixture')}</dt><dd>#${pad2(s.fixture)} &middot; ${esc(L.team(s.opponent.name))} (${s.opponent.formation})</dd>
      <dt>${L.t('office.formation')}</dt><dd>${s.formation}</dd>
      <dt>${L.t('office.record')}</dt><dd>${L.t('office.recordVal', r)}</dd>
      <dt>${L.t('office.notes')}</dt><dd>${L.t('office.tagsWritten', { n: s.squad.filter(p => p.tags.length).length })}</dd>
      <dt>${L.t('office.tired')}</dt><dd${tired ? ' class="warn"' : ''}>${L.t('office.tiredVal', { n: tired, t: s.squad.length })}</dd>
      <dt>${L.t('office.pitch')}</dt><dd>${this.live ? L.t('office.live') : L.t('office.pitchStates')[this.pitchIdx]}</dd>`;
    this.$('office-status').textContent = this.live
      ? L.t('office.liveStatus', { h: L.team(s.clubName), x: this.engine.sides[0].score, y: this.engine.sides[1].score, a: L.team(this.engine.sides[1].name) })
      : L.t('office.rain');
  }

  /* ---------- SQUAD: energy, roles, substitutions (no hidden attributes rendered) ---------- */
  renderSquad() {
    const s = this.state;
    const live = this.live;
    if (live) this.selected = null;
    const byPos = (a, b) => POS_ORDER[a.position] - POS_ORDER[b.position];
    const selStarter = this.selected ? s.isStarter(this.selected) : null;

    const row = (p, starter) => {
      const e = Math.round(p.energy);
      const cls = e >= 70 ? 'hi' : e >= ENERGY.TIRED ? 'mid' : 'lo';
      const isSel = this.selected === p.id;
      const canSwap = this.selected && selStarter !== starter;
      const label = canSwap ? L.t('squad.swap') : isSel ? L.t('squad.cancel') : L.t(starter ? 'squad.out' : 'squad.in');
      const line = starter ? s.slotLine(p.id) : null;
      const oop = line && line !== 'GK' && NATURAL_LINE[p.position] !== line ? `<span class="oop">${L.t('squad.oop', { l: L.line(line) })}</span>` : '';
      return `<tr class="${isSel ? 'sel' : ''}${e < ENERGY.TIRED ? ' tired' : ''}">
        <td class="nm"><span class="num">${p.number}</span>${esc(L.name(p.name))}${oop}</td>
        <td><span class="pos ${p.position}">${L.pos(p.position)}</span></td>
        <td><div class="energy ${cls}" title="${e}%"><i style="width:${e}%"></i><span>${e}%${e < ENERGY.TIRED ? ' · ×0.5' : ''}</span></div></td>
        <td>${p.tags.length ? `<div class="tags">${p.tags.map(t => this.tagChip(t, p.id, !live)).join('')}</div>` : `<span class="empty">${L.t('squad.none')}</span>`}</td>
        <td class="act"><button class="btn small ${canSwap ? 'go' : ''}" data-sub="${p.id}" ${live ? 'disabled' : ''}>${label}</button></td>
      </tr>`;
    };
    this.$('squad-body').innerHTML =
      `<tr class="grp"><td colspan="5">${L.t('squad.xi')} · ${s.formation}</td></tr>` +
      s.starters().map(p => row(p, true)).join('') +
      `<tr class="grp"><td colspan="5">${L.t('squad.bench')} (${s.bench().length})</td></tr>` +
      s.bench().sort(byPos).map(p => row(p, false)).join('');

    const tiredXI = s.starters().filter(p => p.energy < ENERGY.TIRED).length;
    this.$('squad-status').textContent = live ? L.t('squad.locked')
      : this.selected ? L.t('squad.pick', { name: L.name(s.player(this.selected).name) })
      : L.t('squad.status', { n: tiredXI });
  }

  onSubClick(id) {
    const s = this.state;
    if (!this.selected || this.selected === id || s.isStarter(this.selected) === s.isStarter(id)) {
      this.selected = this.selected === id ? null : id;
    } else {
      const err = s.swap(this.selected, id);
      this.selected = null;
      if (err) this.alert(L.t('squad.err.' + err), L.t('nav.squad'));
      this.afterLineupChange();
    }
    this.renderSquad();
  }

  tagChip(tag, id, removable) {
    const tone = TAGS[tag]?.tone || 'neutral';
    const x = removable ? `<button data-untag="${esc(tag)}" data-id="${id}" aria-label="${esc(L.t('squad.remove'))}" title="${esc(L.t('squad.remove'))}">&times;</button>` : '';
    return `<span class="tag ${tone}" title="${esc(L.tagDesc(tag))}">${esc(L.tag(tag))}${x}</span>`;
  }

  /* ---------- TACTICS ---------- */
  fillFormations() {
    this.$('formation').innerHTML = FORMATION_KEYS.map(f => `<option value="${f}">${f}</option>`).join('');
  }

  renderTactics() {
    const s = this.state;
    const sel = this.$('formation');
    sel.value = s.formation;
    sel.disabled = this.live;
    this.$('btn-auto').disabled = this.live;

    const c = lineCounts(s.formation), base = lineCounts('4-4-2');
    this.$('tac-strength').innerHTML = [0, 1, 2].map(z => {
      const own = presence(c, z), ref = presence(base, z);
      const d = own - ref;
      const cls = d > 0.01 ? 'ok' : d < -0.01 ? 'bad' : '';
      return `<dt>${L.t('tac.z' + z)}</dt><dd class="${cls}">${own.toFixed(2)} (${d >= 0 ? '+' : ''}${d.toFixed(2)})</dd>`;
    }).join('');

    const oop = s.outOfPosition();
    this.$('tac-warn').innerHTML = oop.length
      ? oop.map(({ p, line }) => `<div class="w">${L.t('tac.oop', { n: esc(L.name(p.name)), p: L.pos(p.position), l: L.line(line) })}</div>`).join('')
      : `<div class="okmsg">${L.t('tac.allGood')}</div>`;

    this.board.setup([{ entries: s.slots().map((sl, i) => ({ ...sl, p: s.player(s.lineup[i]) })) }], { board: true });
    if (this.selSlot != null) this.board.select(s.lineup[this.selSlot]);
    this.$('tac-board').classList.toggle('locked', this.live);
    this.$('tac-status').textContent = L.t('tac.status', { f: s.formation, d: c.DEF, m: c.MID, a: c.ATT });
    this.$('tac-sel').textContent = this.live ? L.t('tac.locked')
      : this.selSlot != null ? L.t('tac.pick', { n: L.name(s.player(s.lineup[this.selSlot]).name) }) : '';
  }

  onBoardClick(i) {
    if (this.live) return;
    if (i === 0) { this.alert(L.t('tac.gk'), L.t('nav.tactics')); this.selSlot = null; this.renderTactics(); return; }
    if (this.selSlot == null) this.selSlot = i;
    else if (this.selSlot === i) this.selSlot = null;
    else { this.state.swapSlots(this.selSlot, i); this.selSlot = null; this.afterLineupChange(); return; }
    this.renderTactics();
  }

  /* ---------- MATCH ---------- */
  renderShouts() {
    document.querySelectorAll('[data-shout]').forEach(b => {
      const on = b.dataset.shout === this.mentality;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on);
    });
  }
  renderSpeedBtns() {
    document.querySelectorAll('[data-speed]').forEach(b => {
      const on = Number(b.dataset.speed) === this.speed;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on);
    });
  }

  homeTeam() { return { name: this.state.clubName, players: this.state.starters(), formation: this.state.formation }; }

  /** Pre-match: both teams standing in their formations. */
  prepareRadar() {
    const home = MatchEngine.buildSide(this.homeTeam(), true);
    const away = MatchEngine.buildSide(this.state.opponent, false);
    this.radar.setup([home, away]);
    this.radar.setTransition(0.5);
  }

  prepareMatch() {
    this.$('sb-score').textContent = '0 - 0';
    this.$('sb-min').textContent = "00'";
    this.$('sb-bar').style.width = '0%';
    this.$('sb-period').textContent = L.t('period.pre');
    this.$('carrier').textContent = '—'; this.$('poss').textContent = '—';
    this.logEntries = [];
    this.$('log').innerHTML = '';
    const s = this.state;
    this.appendLog({ minute: 0, type: 'flavor', key: 'match.intro', vars: { a: { team: s.clubName }, b: { team: s.opponent.name } }, side: -1, r: 0 });
    this.appendLog({ minute: 0, type: 'coach', key: 'match.hintShouts', vars: {}, side: -1, r: 0 });
    const tired = s.starters().filter(p => p.energy < ENERGY.TIRED);
    if (tired.length) this.appendLog({ minute: 0, type: 'turn', key: 'match.tiredWarn', vars: { n: { list: tired } }, side: 0, r: 0 });
    const oop = s.outOfPosition().map(o => o.p);
    if (oop.length) this.appendLog({ minute: 0, type: 'turn', key: 'match.oopWarn', vars: { n: { list: oop } }, side: 0, r: 0 });
    this.prepareRadar();
    this.renderMatchChrome();
    this.renderTeamStats(MatchEngine.blankStats());
  }

  renderMatchChrome() {
    const s = this.state, e = this.engine;
    const fixtureNo = e && e.finished ? s.fixture - 1 : s.fixture;
    this.$('match-title').textContent = L.t('match.title', { n: pad2(fixtureNo) });
    this.$('match-fixture').textContent = L.t('match.home', { c: L.team(s.clubName) });
    this.$('sb-home').textContent = L.team(s.clubName).replace(' U-14', '');
    this.$('sb-away').textContent = L.team(s.opponent.name);
    this.$('forms').textContent = `${e ? e.sides[0].formation : s.formation} vs ${s.opponent.formation}`;
    const btn = this.$('btn-start'), sp = this.$('speed'), st = this.$('match-status');
    let slow = false;
    if (!e) {
      btn.disabled = false; btn.innerHTML = L.t('match.start');
      sp.textContent = L.t('match.ready'); st.textContent = L.t('match.statusReady');
    } else if (!e.finished) {
      slow = e.highlight;
      btn.disabled = true; btn.innerHTML = L.t('match.inProgress');
      sp.textContent = slow ? L.t('match.slow') : L.t('match.run', { x: e.speed });
      st.textContent = L.t('match.statusLive');
    } else {
      btn.disabled = false; btn.innerHTML = L.t('match.next');
      sp.textContent = L.t('match.ft');
      st.textContent = L.t('match.end' + this.state.lastReport.result);
    }
    sp.classList.toggle('slow', slow);
  }

  onStartButton() {
    if (this.engine && this.engine.finished) {   // "Next fixture"
      this.state.opponent = this.state.makeOpponent();
      this.engine = null;
      this.prepareMatch();
      this.renderAll();
      return;
    }
    if (this.engine) return;
    this.state.notebookUnlocked = false;
    this.syncLocks();

    this.engine = new MatchEngine(this.homeTeam(), this.state.opponent, {
      onLog: e => this.appendLog(e),
      onUpdate: eng => this.renderLive(eng),
      onSpeed: d => {
        // dot animation length follows the tick length (0.5s at 1x and during highlights)
        this.radar.setTransition(d >= MatchEngine.HIGHLIGHT ? 0.5 : clamp(d / 1000 * 0.85, 0.03, 0.5));
        this.renderMatchChrome();
      },
      onGoal: () => {
        const el = this.$('sb-score');
        el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
      },
      onEnd: eng => this.onMatchEnd(eng),
    }, { mentality: this.mentality, speed: this.speed });
    this.radar.setup(this.engine.sides);
    this.engine.start();
    this.renderMatchChrome();
    this.renderSquad();
    this.renderTactics();
  }

  logLine(e) {
    const sideCls = e.side === 0 ? 'us' : e.side === 1 ? 'them' : '';
    const line = document.createElement('span');
    line.className = 'ln';
    line.innerHTML = `<span class="m">${pad2(e.minute)}'</span><span class="${sideCls} ${e.type}">${esc(this.entryText(e))}</span>`;
    return line;
  }

  appendLog(e) {
    const log = this.$('log');
    const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    this.logEntries.push(e);
    log.appendChild(this.logLine(e));
    while (log.children.length > 400) { log.removeChild(log.firstChild); this.logEntries.shift(); }
    if (nearBottom) log.scrollTop = log.scrollHeight;
  }

  rerenderLog() {
    const log = this.$('log');
    const frag = document.createDocumentFragment();
    this.logEntries.forEach(e => frag.appendChild(this.logLine(e)));
    log.innerHTML = '';
    log.appendChild(frag);
    log.scrollTop = log.scrollHeight;
  }

  renderLive(eng) {
    const [a, b] = eng.sides;
    this.$('sb-score').textContent = `${a.score} - ${b.score}`;
    this.$('sb-min').textContent = `${pad2(eng.minute)}'`;
    this.$('sb-bar').style.width = `${(eng.minute / 90) * 100}%`;
    this.$('sb-period').textContent = L.t(eng.finished ? 'period.ft' : eng.minute <= 45 ? 'period.h1' : 'period.h2');
    this.$('carrier').textContent = eng.finished ? '—' : `#${eng.carrier.number} ${L.name(eng.carrier.name)} (${L.team(eng.sides[eng.poss].name)})`;
    const total = eng.possTicks[0] + eng.possTicks[1] || 1;
    this.$('poss').textContent = `${Math.round(eng.possTicks[0] / total * 100)}% - ${Math.round(eng.possTicks[1] / total * 100)}%`;
    this.renderTeamStats(eng.teamTotals(0));
    this.radar.render(eng);
    if (this.view === 'office') this.renderOffice();
  }

  renderTeamStats(t) {
    this.$('team-stats').innerHTML = `
      <dt>${L.t('st.passOk')}</dt><dd class="ok">${t.passOk}</dd>
      <dt>${L.t('st.passFail')}</dt><dd class="bad">${t.passFail}</dd>
      <dt>${L.t('st.tackles')}</dt><dd>${t.tackles}</dd>
      <dt>${L.t('st.dribbles')}</dt><dd>${t.dribbleOk}/${t.dribbleFail}</dd>
      <dt>${L.t('st.shots')}</dt><dd>${t.shots} (${t.onTarget})</dd>
      <dt>${L.t('st.goals')}</dt><dd class="ok">${t.goals}</dd>
      <dt>${L.t('st.saves')}</dt><dd>${t.saves}</dd>
      <dt>${L.t('st.cards')}</dt><dd class="${t.red ? 'bad' : ''}">${t.yellow}/${t.red}</dd>`;
  }

  onMatchEnd(eng) {
    const [a, b] = eng.sides;
    const result = a.score > b.score ? 'W' : a.score === b.score ? 'D' : 'L';
    const played = a.players;
    const chosen = shuffle(played).slice(0, 3);
    this.state.lastReport = {
      fixture: this.state.fixture, opponent: b.name, gf: a.score, ga: b.score, result,
      players: chosen.map(p => ({ id: p.id, stats: { ...eng.st(p) } })),
    };
    this.state.applyFatigue(played.map(p => p.id));
    this.state.recordResult(a.score, b.score);
    this.state.notebookUnlocked = true;
    this.renderAll();
    this.renderMatchChrome();
    if (this.view !== 'notes') this.$('tk-notes').classList.add('alert');
  }

  /* ---------- NOTEBOOK: assign ONE role per player ---------- */
  renderNotebook() {
    const body = this.$('notes-body');
    const rep = this.state.lastReport;
    if (!this.state.notebookUnlocked || !rep) {
      body.innerHTML = `<div class="locked-msg">${L.t('notes.lockedMsg')}</div>`;
      this.$('notes-status').textContent = L.t('notes.locked');
      return;
    }
    const cards = rep.players.map(({ id, stats: s }) => {
      const p = this.state.player(id);
      if (!p) return '';
      const lines = [
        L.t('notes.pass', { a: s.passOk, b: s.passFail }),
        L.t('notes.tackles', { a: s.tackles, b: s.tacklesLost }),
        L.t('notes.drib', { a: s.dribbleOk, b: s.dribbleFail }),
        L.t('notes.shots', { a: s.shots, b: s.onTarget, c: s.goals }),
      ];
      if (p.position === 'GK') lines.push(L.t('notes.saves', { a: s.saves }));
      if (s.yellow || s.red) lines.push(L.t('notes.cards', { a: s.yellow, b: s.red }));
      lines.push(L.t('notes.energy', { a: Math.round(p.energy) }));
      const btns = TAG_KEYS.map(t => {
        const has = p.tags.includes(t);
        const key = has ? 'notes.noted' : p.tags.length ? 'notes.change' : 'notes.add';
        return `<button class="btn ${has ? 'done' : ''}" data-tag="${t}" data-id="${p.id}" ${has ? 'disabled' : ''} title="${esc(L.tagDesc(t))}">
          ${L.t(key, { t: esc(L.tag(t)) })}<small>${esc(L.tagDesc(t))}</small></button>`;
      }).join('');
      return `<article class="card">
        <h3><span class="num dark">${p.number}</span>${esc(L.name(p.name))}<span class="pos ${p.position}">${L.pos(p.position)}</span></h3>
        <ul>${lines.map(l => `<li>${l}</li>`).join('')}</ul>
        <div class="cur tags">${p.tags.map(t => this.tagChip(t, p.id, false)).join('') || `<span style="color:#6f6754">${L.t('notes.noTags')}</span>`}</div>
        <div class="tag-btns">${btns}</div>
      </article>`;
    }).join('');
    body.innerHTML = `
      <div class="nb-head">
        <h2>${L.t('notes.head', { n: pad2(rep.fixture), o: esc(L.team(rep.opponent)) })}</h2>
        <span class="res ${rep.result}">${L.t('res.' + rep.result)} &nbsp;${rep.gf} - ${rep.ga}</span>
      </div>
      <p class="nb-hint">${L.t('notes.hint')}</p>
      <div class="cards">${cards}</div>`;
    this.$('notes-status').textContent = L.t('notes.status', { n: rep.fixture });
  }
}

/* =========================================================
   BOOT
   ========================================================= */
const game = new GameState();
const ui = new UIController(game);
window.YAM = { game, ui, MatchEngine, L, ENERGY, FORMATIONS }; // handy for debugging in DevTools
</script>
